# Synthetic Dovecot 2.4 contract for LP3. It intentionally has one fixture
# user, supports IMAP, IMAP IDLE, LMTP delivery, and ManageSieve, and never
# exposes a host port in Compose.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols {
  imap = yes
  lmtp = yes
  sieve = yes
}
listen = *,[::]
base_dir = /run/dovecot/
instance_name = lp3-dovecot
login_greeting = Gulo Gulo LP3 synthetic Dovecot
log_path = /dev/stderr
info_log_path = /dev/stderr

mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
namespace inbox {
  inbox = yes
  separator = /
}

ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /run/gulogulo-lp3-tls/lp3-dovecot.crt
ssl_server_key_file = /run/gulogulo-lp3-tls/lp3-dovecot.key
ssl_server_ca_file = /run/gulogulo-lp3-tls/ca.crt
auth_allow_cleartext = yes

auth_mechanisms = plain login
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service imap {
}

protocol imap {
  mail_max_userip_connections = 20
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
protocol lmtp {
  postmaster_address = postmaster@gulogulo.test
  mail_plugins {
    sieve = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}
protocol sieve {
  managesieve_max_line_length = 65536
}

sieve_script personal {
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
