name: Pull request validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      architecture_mode:
        description: Run the fast amd64 gate or the final arm64-only gate
        type: choice
        required: false
        default: amd64
        options:
          - amd64
          - multiarch

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      context: pull-request
      architecture_mode: ${{ inputs.architecture_mode || 'amd64' }}
