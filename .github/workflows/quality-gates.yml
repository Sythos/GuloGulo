          test -f src/core/backup/backup-contract.ts
          test -f src/core/backup/backup-contract.test.ts
          test -f src/core/backup/index.ts
          test -f src/core/lifecycle/retention.ts
          test -f src/core/lifecycle/retention.test.ts
