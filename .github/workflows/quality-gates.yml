      - name: Set up Node.js when package metadata exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install dependencies and run the test script when available
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable --mode=skip-builds
          else
            node -e "const p=require('./package.json'); if (Object.keys(p.dependencies || {}).length || Object.keys(p.devDependencies || {}).length || Object.keys(p.optionalDependencies || {}).length) { console.error('A lockfile is required when package dependencies are declared.'); process.exit(1); }"
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

          if node -e "const packageData = require('./package.json'); process.exit(packageData.scripts && packageData.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No package test script is defined; repository checks remain active."
          fi

      - name: Run LP3 typed mail contract gates
        if: hashFiles('src/core/mail/mail-core.test.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:server
          node --experimental-strip-types src/core/mail/mail-scanners.test.ts
          node --experimental-strip-types src/core/mail/imap-idle.test.ts
          node --experimental-strip-types src/core/mail/imap-idle-adapter.test.ts
          node --experimental-strip-types src/core/mail/smtp-queue-adapter.test.ts
          node --experimental-strip-types src/core/mail/mail-core.test.ts
          node --experimental-strip-types src/core/mail/scanner-signatures.test.ts

      - name: Run migrated-audit gates (amd64)
        if: hashFiles('tsconfig.lp8.json') != '' && hashFiles('scripts/m10-release-audit.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:server
          npx tsc --project tsconfig.lp8.json
          node --experimental-strip-types src/core/release/local-proof-scope.test.ts
          node --experimental-strip-types src/core/release/local-proof-topology.test.ts
          node --experimental-strip-types src/core/release/release-evidence.test.ts
          node --experimental-strip-types scripts/m10-release-audit.ts

      - name: Run LP9 source-language and local-release gates (amd64)
        if: hashFiles('scripts/lp9-source-audit.ts') != '' && hashFiles('scripts/lp9-release-audit.ts') != '' && hashFiles('tsconfig.lp9.json') != ''
        shell: bash
        run: npm run test:lp9

      - name: Report package-test status when no package exists
        if: hashFiles('package.json') == ''
        shell: bash
        run: echo "No package.json exists yet; package tests are deferred until implementation is added."
