name: Quality gates

on:
  workflow_call:
    inputs:
      context:
        description: Execution context for the quality gates
        required: true
        type: string

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality gates (${{ inputs.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...$COMMIT_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
            git diff --check "$EVENT_BEFORE" "$COMMIT_SHA"
          else
            git show --check --pretty= "$COMMIT_SHA"
          fi

      - name: Validate repository entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -Fq 'MIT License' LICENSE
          test -f README.md
          grep -Fxq '# Gulo Gulo' README.md
          test -f scripts/m0-smoke.ps1
          test -f scripts/m1-fixture-smoke.ps1
          test -f test/fixtures/manifest.json
          test -f test/fixtures/tenant.json
          test -f test/fixtures/failure-modes.json
          test -f test/fixtures/README.md
          test -f scripts/container-patch.sh
          test -f config/schema.v1.json
          test -f doc/README.md
          test -f doc/configuration.md
          test -f doc/observability.md
          test -f doc/compose-and-fixtures.md
          test -f doc/container-patching.md
          test -f doc/api-and-mcp.md
          test -f doc/identity-and-postgres.md
          test -f doc/storage-and-quotas.md
          test -f src/integrations/tenant-context.mjs
          test -f src/integrations/ldap-client.mjs
          test -f src/integrations/postgres-store.mjs
          test -f src/db/migrations/0001_m2_foundation.sql
          test -f .github/workflows/commit-tests.yml
          test -f .github/workflows/pr-validation.yml
          test -f .github/workflows/quality-gates.yml
          grep -Fq 'profiles: ["local"]' compose.yaml
          grep -Fq 'profiles: ["test"]' compose.yaml
          grep -Fq 'profiles: ["fixture"]' compose.yaml

      - name: Validate MIT and SPDX metadata
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            README.md \
            Dockerfile \
            compose.yaml \
            .env.example \
            .dockerignore \
            scripts/m0-smoke.ps1 \
            scripts/m1-fixture-smoke.ps1 \
            scripts/container-patch.sh \
            .gitignore \
            .github/workflows/commit-tests.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/quality-gates.yml; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          while IFS= read -r file; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done < <(find src -type f \( -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' \) -print)

          grep -Fq 'SPDX-License-Identifier: MIT' test/fixtures/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' test/fixtures/README.md

          for file in doc/*.md; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          grep -Fq 'GULOGULO_VOLUMES_EXTERNAL' compose.yaml
          grep -Fq 'FORCE ROW LEVEL SECURITY' src/db/migrations/0001_m2_foundation.sql
          grep -Fq "set_config('gulogulo.tenant_id'" src/integrations/postgres-store.mjs
          grep -Fq 'rejectUnauthorized: true' src/integrations/ldap-client.mjs

          grep -Fq 'SPDX-License-Identifier: MIT' config/schema.v1.json
          grep -Fq 'Sythos (https://www.sythos.net)' config/schema.v1.json
          grep -Fq 'FROM ubuntu:26.04' Dockerfile
          grep -Fq 'ARG TARGETARCH' Dockerfile
          grep -Fq 'dpkg --print-architecture' Dockerfile
          grep -Fq 'node-v${NODE_VERSION}-linux-${node_arch}.tar.xz' Dockerfile
          grep -Fq 'apt-get update' Dockerfile
          grep -Fq 'apt-get upgrade -y' Dockerfile
          grep -Fq 'GULOGULO_PATCH_STATUS_FILE' compose.yaml
          bash -n scripts/container-patch.sh

          for file in test/fixtures/*.json; do
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (data.spdxLicenseIdentifier !== 'MIT' || data.author !== 'Sythos (https://www.sythos.net)' || data.deterministic !== true) process.exit(1);" "$file"
          done

          if grep -Eq '^(LDAP_BIND_PASSWORD|POSTGRES_PASSWORD|[A-Z_]*(TOKEN|PASSWORD|PRIVATE_KEY))=' .env.example; then
            echo 'Credential values must not be present in .env.example.' >&2
            exit 1
          fi

          node -e "const p=require('./package.json'); if (p.license !== 'MIT' || p.author !== 'Sythos (https://www.sythos.net)' || p.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const p=require('./package-lock.json'); const root=p.packages && p.packages['']; if (!root || root.license !== 'MIT' || root.author !== 'Sythos (https://www.sythos.net)' || root.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const s=require('./config/schema.v1.json'); if (!s.properties.buildDigest || !s.properties.patching) process.exit(1)"
          test -f package-lock.json

      - name: Set up Node.js when package metadata exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install dependencies and run the test script when available
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable --mode=skip-builds
          else
            node -e "const p=require('./package.json'); if (Object.keys(p.dependencies || {}).length || Object.keys(p.devDependencies || {}).length || Object.keys(p.optionalDependencies || {}).length) { console.error('A lockfile is required when package dependencies are declared.'); process.exit(1); }"
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

          if node -e "const packageData = require('./package.json'); process.exit(packageData.scripts && packageData.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No package test script is defined; repository checks remain active."
          fi

      - name: Run Docker Compose M0 smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m0-smoke.ps1

      - name: Set up QEMU for Ubuntu multi-architecture builds
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v4.2.0

      - name: Validate Ubuntu 26.04 LTS amd64 and arm64 images
        if: hashFiles('Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gulogulo-ubuntu-26.04.oci.tar"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg NODE_VERSION=26.7.0 \
            --provenance=false \
            --sbom=false \
            --tag gulogulo:ci-ubuntu-26.04 \
            --output "type=oci,dest=$output" \
            .
          test -s "$output"

      - name: Run Compose test profile
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail

          project="gulogulo-ci-test-${GITHUB_RUN_ID}"
          compose=(docker compose --project-name "$project" --file compose.yaml --env-file .env.example)
          cleanup() {
            "${compose[@]}" --profile test down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${compose[@]}" --profile local config --quiet
          "${compose[@]}" --profile test config --quiet
          "${compose[@]}" --profile test build --pull gulogulo-test
          "${compose[@]}" --profile test run --rm --no-deps gulogulo-test

      - name: Run disposable PostgreSQL M2 integration contract
        if: hashFiles('src/integrations/postgres.integration.test.mjs') != ''
        shell: bash
        run: |
          set -euo pipefail
          container="gulogulo-m2-postgres-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_DB=gulogulo \
            --env POSTGRES_USER=gulogulo \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18 >/dev/null
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null
          GULOGULO_M2_POSTGRES_DSN="postgresql://gulogulo@$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container"):5432/gulogulo" npm run test:m2:postgres

      - name: Run M1 fixture, health, and metrics smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m1-fixture-smoke.ps1 -RequireMetrics

      - name: Report Docker smoke-check status when Compose is not defined
        if: hashFiles('compose.yaml') == '' && hashFiles('compose.yml') == '' && hashFiles('docker-compose.yml') == '' && hashFiles('docker-compose.yaml') == ''
        shell: bash
        run: echo "No Compose file exists yet; M0 Docker smoke checks are deferred until the Docker-first scaffold is added."

      - name: Report package-test status when no package exists
        if: hashFiles('package.json') == ''
        shell: bash
        run: echo "No package.json exists yet; package tests are deferred until implementation is added."
