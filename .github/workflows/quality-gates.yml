          test -f src/core/mail/mail-core.ts
          test -f src/core/mail/mail-core.test.ts
          test -f src/core/mail/scanner-signatures.ts
          test -f src/core/mail/scanner-signatures.test.ts
          test -f .github/workflows/commit-tests.yml
          test -f .github/workflows/pr-validation.yml
          test -f .github/workflows/quality-gates.yml
          test -f src/core/dav/caldav/caldav-contract.ts
          test -f src/core/dav/caldav/caldav-contract.test.ts
          test -f src/core/dav/carddav/carddav-store.ts
          test -f src/core/dav/carddav/carddav-store.test.ts
          test -f src/core/dav/carddav/index.ts
          test -f src/core/dav/discovery/index.ts
          test -f src/core/dav/discovery/index.test.ts
          test -f src/web/security/csrf.ts
