          grep -Fq 'gulogulo-lp4-web' compose.yaml
          grep -Fq 'LP4_LOGIN_EMAIL: ${LP4_LOGIN_EMAIL}' compose.yaml
          grep -Fq 'id="login-shell"' web/index.html
          grep -Fq '/api/session/login' src/runtime/server.ts
          grep -Fq '/assets/gulo-gulo-calendar-mail.png' src/runtime/server.ts
          grep -Fq 'CONTENT_ACCESS_DENIED' src/admin/rbac.ts
          grep -Fq 'QUOTA_EXCEEDED' src/admin/quota.ts
          grep -Fq 'MASTER_LOG_ACCESS_DISABLED' src/admin/rbac.ts
          grep -Fq 'MAX_PASSWORD_EXPIRY_DAYS = 9999' src/auth/password-policy.ts
          grep -Fq 'REPLAYED_CODE' src/auth/totp.ts
          grep -Fq 'challenge' src/auth/webauthn.ts
