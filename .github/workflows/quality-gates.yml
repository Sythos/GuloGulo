name: Quality gates

on:
  workflow_call:
    inputs:
      context:
        description: Execution context for the quality gates
        required: true
        type: string

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality gates (${{ inputs.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...$COMMIT_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
            git diff --check "$EVENT_BEFORE" "$COMMIT_SHA"
          else
            git show --check --pretty= "$COMMIT_SHA"
          fi

      - name: Validate repository entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -Fq 'MIT License' LICENSE
          test -f README.md
          grep -Fxq '# Gulo Gulo' README.md
          test -f assets/README.md
          test -f assets/gulo-gulo-calendar-mail.png
          test -f scripts/m0-smoke.ps1
          test -f scripts/m1-fixture-smoke.ps1
          test -f test/fixtures/manifest.json
          test -f test/fixtures/tenant.json
          test -f test/fixtures/failure-modes.json
          test -f test/fixtures/README.md
          test -f scripts/container-patch.sh
          test -f config/schema.v1.json
          test -f doc/README.md
          test -f doc/configuration.md
          test -f doc/observability.md
          test -f doc/compose-and-fixtures.md
          test -f doc/container-patching.md
          test -f doc/api-and-mcp.md
          test -f doc/identity-and-postgres.md
          test -f doc/storage-and-quotas.md
          test -f doc/mail-core.md
          test -f doc/upgrade-and-migration.md
          test -f doc/web-foundation.md
          test -f doc/dav-and-discovery.md
          test -f doc/release-readiness.md
          test -f release/v1-release-evidence.template.json
          test -f scripts/m10-release-audit.mjs
          test -f tsconfig.json
          test -f web/index.html
          test -f web/styles.css
          test -f web/manifest.json
          test -f web/build.mjs
          test -f web/src/app.ts
          test -f web/test/web-shell.test.mjs
          test -f src/web/security/security.test.mjs
          test -f src/web/content/email-content.test.mjs
          test -f src/web/content/attachment-policy.test.mjs
          test -f src/web/content/timezone.test.mjs
          test -f src/web/realtime/event-normalizer.test.mjs
          test -f src/web/backup/backup-request.test.mjs
          test -f src/integrations/tenant-context.mjs
          test -f src/integrations/ldap-client.mjs
          test -f src/integrations/postgres-store.mjs
          test -f src/db/migrations/0001_m2_foundation.sql
          test -f src/mail/mail-policy.mjs
          test -f src/mail/mail-scanners.mjs
          test -f src/mail/mail-queue.mjs
          test -f src/mail/imap-idle.mjs
          test -f src/mail/mail-core.mjs
          test -f src/mail/mail-core.test.mjs
          test -f .github/workflows/commit-tests.yml
          test -f .github/workflows/pr-validation.yml
          test -f .github/workflows/quality-gates.yml
          test -f src/dav/caldav/caldav-contract.mjs
          test -f src/dav/caldav/caldav-contract.test.mjs
          test -f src/dav/carddav/carddav-store.mjs
          test -f src/dav/carddav/carddav-store.test.mjs
          test -f src/dav/carddav/index.mjs
          test -f src/dav/discovery/index.mjs
          test -f src/dav/discovery/index.test.mjs
          test -f src/admin/rbac.mjs
          test -f src/admin/rbac.test.mjs
          test -f src/admin/delegation.mjs
          test -f src/admin/delegation.test.mjs
          test -f src/admin/quota.mjs
          test -f src/admin/quota.test.mjs
          test -f src/admin/admin-tools.mjs
          test -f src/admin/admin-tools.test.mjs
          test -f src/auth/password-policy.mjs
          test -f src/auth/password-hashing.mjs
          test -f src/auth/totp.mjs
          test -f src/auth/webauthn.mjs
          test -f src/auth/recovery-codes.mjs
          test -f src/auth/auth.test.mjs
          test -f doc/rbac-admin-mfa.md
          test -f src/lifecycle/retention.mjs
          test -f src/lifecycle/retention.test.mjs
          test -f src/lifecycle/account-lifecycle.mjs
          test -f src/lifecycle/account-lifecycle.test.mjs
          test -f src/backup/backup-contract.mjs
          test -f src/backup/backup-contract.test.mjs
          test -f src/observability/log-policy.mjs
          test -f src/observability/structured-event.mjs
          test -f src/observability/alert-policy.mjs
          test -f src/observability/observability.test.mjs
          test -f doc/lifecycle-backup-dr.md
          test -f doc/local-proof-scope.md
          test -f src/ops/acme/index.mjs
          test -f src/ops/acme/index.test.mjs
          test -f src/ops/abuse/index.mjs
          test -f src/ops/abuse/index.test.mjs
          test -f doc/acme-abuse-deployment.md
          test -f src/upgrade/compatibility.mjs
          test -f src/upgrade/control-plane.mjs
          test -f src/upgrade/rollout.mjs
          test -f src/upgrade/index.mjs
          test -f src/upgrade/upgrade-contract.test.mjs
          test -f src/release/index.mjs
          test -f src/release/release-evidence.mjs
          test -f src/release/release-evidence.test.mjs
          test -f src/release/local-proof-scope.mjs
          test -f src/release/local-proof-scope.test.mjs
          test -f release/local-proof-scope.json
          test -f scripts/lp0-scope-audit.mjs
          test -f doc/upgrade-and-migration.md
          grep -Fq 'profiles: ["local"]' compose.yaml
          grep -Fq 'profiles: ["test"]' compose.yaml
          grep -Fq 'profiles: ["fixture"]' compose.yaml

      - name: Validate MIT and SPDX metadata
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            README.md \
            Dockerfile \
            compose.yaml \
            .env.example \
            .dockerignore \
            scripts/m0-smoke.ps1 \
            scripts/m1-fixture-smoke.ps1 \
            scripts/container-patch.sh \
            scripts/lp0-scope-audit.mjs \
            scripts/m10-release-audit.mjs \
            .gitignore \
            .github/workflows/commit-tests.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/quality-gates.yml; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          while IFS= read -r file; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done < <(find src -type f \( -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' \) -print)

          while IFS= read -r file; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done < <(find web -type f \( -path 'web/dist/*' -prune -o -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' -o -name '*.html' -o -name '*.css' -print \))

          grep -Fq 'SPDX-License-Identifier: MIT' test/fixtures/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' test/fixtures/README.md

          for file in doc/*.md; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.json
          grep -Fq 'SPDX-License-Identifier: MIT' web/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' web/README.md
          grep -Fq 'SPDX-License-Identifier: MIT' assets/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' assets/README.md
          node -e "const m=require('./web/manifest.json'); if (m.license !== 'MIT' || m.author !== 'Sythos (https://www.sythos.net)' || m.spdxLicenseIdentifier !== 'MIT') process.exit(1)"

          grep -Fq 'GULOGULO_VOLUMES_EXTERNAL' compose.yaml
          grep -Fq 'FORCE ROW LEVEL SECURITY' src/db/migrations/0001_m2_foundation.sql
          grep -Fq "set_config('gulogulo.tenant_id'" src/integrations/postgres-store.mjs
          grep -Fq 'rejectUnauthorized: true' src/integrations/ldap-client.mjs
          grep -Fq 'OPEN_RELAY_DISABLED' src/mail/mail-policy.mjs
          grep -Fq 'FORWARDING_DISABLED' src/mail/mail-policy.mjs
          grep -Fq "state === 'bounced'" src/mail/mail-queue.mjs
          grep -Fq 'eventId' src/mail/imap-idle.mjs
          grep -Fq 'fail-closed' doc/mail-core.md
          grep -Fq 'CONTENT_SCOPE_REQUIRED' src/dav/caldav/caldav-contract.mjs
          grep -Fq 'SYNC_SCOPE_DENIED' src/dav/caldav/caldav-contract.mjs
          grep -Fq 'SCOPE_ROLE_DENIED' src/dav/carddav/carddav-store.mjs
          grep -Fq 'WELL_KNOWN_PATHS' src/dav/discovery/index.mjs
          grep -Fq 'PLAINTEXT_DISCOVERY_FORBIDDEN' src/dav/discovery/index.mjs
          grep -Fq 'CONTENT_ACCESS_DENIED' src/admin/rbac.mjs
          grep -Fq 'QUOTA_EXCEEDED' src/admin/quota.mjs
          grep -Fq 'MASTER_LOG_ACCESS_DISABLED' src/admin/rbac.mjs
          grep -Fq 'MAX_PASSWORD_EXPIRY_DAYS = 9999' src/auth/password-policy.mjs
          grep -Fq 'REPLAYED_CODE' src/auth/totp.mjs
          grep -Fq 'challenge' src/auth/webauthn.mjs
          grep -Fq 'One-time recovery' src/auth/recovery-codes.mjs
          grep -Fq 'DEFAULT_TRASH_RETENTION_DAYS = 28' src/lifecycle/retention.mjs
          grep -Fq "BACKUP_ENCRYPTION_ALGORITHM = 'aes-256-gcm'" src/backup/backup-contract.mjs
          grep -Fq 'PURGE_REJECTED' src/lifecycle/retention.mjs
          grep -Fq 'createLogRotationPolicy' src/observability/log-policy.mjs
          grep -Fq 'createStructuredEvent' src/observability/structured-event.mjs
          grep -Fq 'createAlertPolicy' src/observability/alert-policy.mjs
          grep -Fq 'LETSENCRYPT' src/ops/acme/index.mjs
          grep -Fq 'HTTP_01' src/ops/acme/index.mjs
          grep -Fq 'DNS_01' src/ops/acme/index.mjs
          grep -Fq 'createSafeReloadPlan' src/ops/acme/index.mjs
          grep -Fq 'DEFAULT_RATE_LIMITS' src/ops/abuse/index.mjs
          grep -Fq 'createAbuseAuditEvent' src/ops/abuse/index.mjs
          grep -Fq 'validateComposeProductionReadiness' src/ops/abuse/index.mjs
          grep -Fq 'HOST_NAMESPACE_FORBIDDEN' src/ops/abuse/index.mjs
          grep -Fq 'MIGRATION_PHASES' src/upgrade/compatibility.mjs
          grep -Fq 'createSchemaMigrationPlan' src/upgrade/compatibility.mjs
          grep -Fq 'createUpgradeController' src/upgrade/control-plane.mjs
          grep -Fq 'TENANT_CONTROL_PLANE_FORBIDDEN' src/upgrade/control-plane.mjs
          grep -Fq 'PREFLIGHT_FAILED' src/upgrade/control-plane.mjs
          grep -Fq 'createDockerReplacementPlan' src/upgrade/rollout.mjs
          grep -Fq 'createKubernetesBlueGreenPlan' src/upgrade/rollout.mjs
          grep -Fq 'ACTION_NOT_ALLOWLISTED' src/upgrade/rollout.mjs
          grep -Fq 'REQUIRED_SECTION30_ITEMS' src/release/release-evidence.mjs
          grep -Fq 'M10_REVIEWS_INCOMPLETE' src/release/release-evidence.mjs
          grep -Fq 'productionReady' src/release/release-evidence.mjs

          grep -Fq 'SPDX-License-Identifier: MIT' config/schema.v1.json
          grep -Fq 'Sythos (https://www.sythos.net)' config/schema.v1.json
          grep -Fq 'FROM ubuntu:26.04' Dockerfile
          grep -Fq 'ARG TARGETARCH' Dockerfile
          grep -Fq 'dpkg --print-architecture' Dockerfile
          grep -Fq 'node-v${NODE_VERSION}-linux-${node_arch}.tar.xz' Dockerfile
          grep -Fq 'apt-get update' Dockerfile
          grep -Fq 'apt-get upgrade -y' Dockerfile
          grep -Fq 'GULOGULO_PATCH_STATUS_FILE' compose.yaml
          grep -Fq 'GULOGULO_MAIL_SCAN_FAILURE_MODE' compose.yaml
          grep -Fq 'GULOGULO_MAILBOX_ROOT' compose.yaml
          grep -Fq 'providerOnly' config/schema.v1.json
          grep -Fq 'arbitraryCommands' config/schema.v1.json
          bash -n scripts/container-patch.sh

          for file in test/fixtures/*.json; do
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (data.spdxLicenseIdentifier !== 'MIT' || data.author !== 'Sythos (https://www.sythos.net)' || data.deterministic !== true) process.exit(1);" "$file"
          done

          if grep -Eq '^(LDAP_BIND_PASSWORD|POSTGRES_PASSWORD|[A-Z_]*(TOKEN|PASSWORD|PRIVATE_KEY))=' .env.example; then
            echo 'Credential values must not be present in .env.example.' >&2
            exit 1
          fi

          node -e "const p=require('./package.json'); if (p.license !== 'MIT' || p.author !== 'Sythos (https://www.sythos.net)' || p.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const p=require('./package-lock.json'); const root=p.packages && p.packages['']; if (!root || root.license !== 'MIT' || root.author !== 'Sythos (https://www.sythos.net)' || root.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const s=require('./config/schema.v1.json'); if (!s.properties.buildDigest || !s.properties.patching) process.exit(1)"
          test -f package-lock.json
          node -e "const e=require('./release/v1-release-evidence.template.json'); if (e.spdxLicenseIdentifier !== 'MIT' || e.author !== 'Sythos (https://www.sythos.net)' || e.product !== 'Gulo Gulo') process.exit(1)"
          node -e "const s=require('./release/local-proof-scope.json'); if (s.spdxLicenseIdentifier !== 'MIT' || s.author !== 'Sythos (https://www.sythos.net)' || s.proofType !== 'local' || s.networkPolicy !== 'offline_runtime' || s.syntheticDataOnly !== true || s.publicDnsRequired !== false || s.publicAcmeEnabled !== false || s.externalPhaseDeferred !== true) process.exit(1)"

      - name: Set up Node.js when package metadata exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install dependencies and run the test script when available
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable --mode=skip-builds
          else
            node -e "const p=require('./package.json'); if (Object.keys(p.dependencies || {}).length || Object.keys(p.devDependencies || {}).length || Object.keys(p.optionalDependencies || {}).length) { console.error('A lockfile is required when package dependencies are declared.'); process.exit(1); }"
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

          if node -e "const packageData = require('./package.json'); process.exit(packageData.scripts && packageData.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No package test script is defined; repository checks remain active."
          fi

      - name: Run Docker Compose M0 smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m0-smoke.ps1

      - name: Set up QEMU for Ubuntu multi-architecture builds
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v4.2.0

      - name: Validate Ubuntu 26.04 LTS amd64 and arm64 images
        if: hashFiles('Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gulogulo-ubuntu-26.04.oci.tar"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --build-arg NODE_VERSION=26.7.0 \
            --provenance=false \
            --sbom=false \
            --tag gulogulo:ci-ubuntu-26.04 \
            --output "type=oci,dest=$output" \
            .
          test -s "$output"

      - name: Run Compose test profile
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail

          project="gulogulo-ci-test-${GITHUB_RUN_ID}"
          compose=(docker compose --project-name "$project" --file compose.yaml --env-file .env.example)
          cleanup() {
            "${compose[@]}" --profile test down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${compose[@]}" --profile local config --quiet
          "${compose[@]}" --profile test config --quiet
          "${compose[@]}" --profile test build --pull gulogulo-test
          "${compose[@]}" --profile test run --rm --no-deps gulogulo-test

      - name: Run disposable PostgreSQL M2 integration contract
        if: hashFiles('src/integrations/postgres.integration.test.mjs') != ''
        shell: bash
        run: |
          set -euo pipefail
          container="gulogulo-m2-postgres-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_DB=gulogulo \
            --env POSTGRES_USER=gulogulo \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18 >/dev/null
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null
          GULOGULO_M2_POSTGRES_DSN="postgresql://gulogulo@$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container"):5432/gulogulo" npm run test:m2:postgres

      - name: Run M1 fixture, health, and metrics smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m1-fixture-smoke.ps1 -RequireMetrics

      - name: Report Docker smoke-check status when Compose is not defined
        if: hashFiles('compose.yaml') == '' && hashFiles('compose.yml') == '' && hashFiles('docker-compose.yml') == '' && hashFiles('docker-compose.yaml') == ''
        shell: bash
        run: echo "No Compose file exists yet; M0 Docker smoke checks are deferred until the Docker-first scaffold is added."

      - name: Report package-test status when no package exists
        if: hashFiles('package.json') == ''
        shell: bash
        run: echo "No package.json exists yet; package tests are deferred until implementation is added."
