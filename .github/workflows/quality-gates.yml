          test -f release/lp5-local-operations-capacity.json
          test -f release/lp6-local-backup-dr.json
          test -f release/lp7-local-upgrade.json
          test -f release/lp8-local-proof-bundle.json
          test -f release/lp9-local-proof.json
          test -f tsconfig.lp8.json
          test -f tsconfig.lp9.json
          test -f scripts/lp9-source-audit.ts
          test -f scripts/lp9-source-audit.test.ts
          test -f scripts/lp9-release-audit.ts
          test -f scripts/lp9-release-audit.test.ts
          test -f scripts/lp3-proof-smoke.ts
          test -f scripts/m10-release-audit.ts
          test -f src/core/release/index.ts
          test -f src/core/release/local-proof-scope.ts
          test -f src/core/release/local-proof-scope.test.ts
          test -f src/core/release/local-proof-topology.ts
          test -f src/core/release/local-proof-topology.test.ts
          test -f src/core/release/release-evidence.ts
          test -f src/core/release/release-evidence.test.ts
          test -f scripts/m10-release-audit.mjs
          test -f scripts/lp3-proof-smoke.mjs
