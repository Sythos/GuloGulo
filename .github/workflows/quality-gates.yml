          test -f src/web/security/session-manager.ts
          test -f src/web/security/security.test.ts
          test -f src/web/content/attachment-policy.ts
          test -f src/web/content/attachment-policy.test.ts
          test -f src/web/content/email-content.ts
          test -f src/web/content/email-content.test.ts
          test -f src/web/content/timezone.ts
          test -f src/web/content/timezone.test.ts
          test -f src/web/realtime/event-normalizer.ts
          test -f src/web/realtime/event-normalizer.test.ts
          test -f src/web/backup/backup-request.ts
          test -f src/web/backup/backup-request.test.ts
          test -f src/core/admin/rbac.ts
          test -f src/core/admin/rbac.test.ts
          test -f src/core/admin/delegation.ts
          test -f src/core/admin/delegation.test.ts
          test -f src/core/admin/quota.ts
          test -f src/core/admin/quota.test.ts
          test -f src/core/admin/admin-tools.ts
          test -f src/core/admin/admin-tools.test.ts
          test -f src/core/auth/password-policy.ts
          test -f src/core/auth/password-hashing.ts
          test -f src/core/auth/totp.ts
          test -f src/core/auth/webauthn.ts
          test -f src/core/auth/recovery-codes.ts
          test -f src/core/auth/auth.test.ts
          test -f src/runtime/index.ts
          test -f src/runtime/server.ts
          test -f src/runtime/config.ts
          test -f src/runtime/logger.ts
          test -f src/runtime/metrics.ts
          test -f src/core/foundation/config.test.ts
          test -f test/fixtures/scanner-signatures/rspamd/active.json
          test -f test/fixtures/scanner-signatures/rspamd/versions/fixture-rspamd-1/manifest.json
          test -f test/fixtures/scanner-signatures/clamav/active.json
          test -f test/fixtures/scanner-signatures/clamav/versions/fixture-clamav-1/manifest.json
          test -f test/fixtures/scanner-signatures/README.md
          test -f doc/rbac-admin-mfa.md
          test -f doc/lifecycle-backup-dr.md
          test -f src/core/ops/abuse/index.ts
          test -f src/core/ops/abuse/index.test.ts
          test -f src/core/observability/index.ts
          test -f src/core/observability/observability.test.ts
          test -f doc/abuse-deployment.md
          test -f src/core/upgrade/compatibility.ts
          test -f src/core/upgrade/index.ts
          test -f src/core/upgrade/upgrade-contract.test.ts
          test -f release/local-proof-scope.json
          test -f release/local-proof-topology.json
          test -f doc/upgrade-and-migration.md

      - name: Validate MIT and SPDX metadata
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            README.md \
            .env.example \
            scripts/lp3-proof-smoke.mjs \
            scripts/lp3-proof-smoke.ts \
            scripts/lp9-source-audit.ts \
            scripts/lp9-source-audit.test.ts \
            scripts/lp9-release-audit.ts \
            scripts/lp9-release-audit.test.ts \
            scripts/sbom-release-audit.ts \
            scripts/sbom-release-audit.test.ts \
            scripts/lp4-proof-check.ts \
            scripts/lp5-proof-check.ts \
            scripts/lp6-source-fixture.ts \
            scripts/lp6-backup-worker.ts \
            scripts/lp6-restore-worker.ts \
            scripts/lp7-proof-check.ts \
            scripts/m10-release-audit.ts \
            web/build.ts \
            web/test/web-shell.test.ts \
            src/core/release/index.ts \
            src/core/release/local-proof-scope.ts \
            src/core/release/local-proof-scope.test.ts \
            src/core/release/local-proof-topology.ts \
            src/core/release/local-proof-topology.test.ts \
            src/core/release/release-evidence.ts \
            src/core/release/release-evidence.test.ts \
            src/core/upgrade/compatibility.ts \
            src/core/upgrade/index.ts \
            src/core/upgrade/upgrade-contract.test.ts \
            src/integrations/control-panel.ts \
            src/integrations/control-panel.test.ts \
            src/core/mail/scanner-signatures.ts \
            src/core/mail/scanner-signatures.test.ts \
            scripts/m10-release-audit.mjs \
            .gitignore \
            .github/workflows/commit-tests.yml \
            .github/workflows/pr-validation.yml \
            .github/workflows/quality-gates.yml; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          while IFS= read -r file; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done < <(find src -type f \( -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' \) -print)

          while IFS= read -r file; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done < <(find web -type f \( -path 'web/dist/*' -prune -o -name '*.mjs' -o -name '*.cjs' -o -name '*.js' -o -name '*.ts' -o -name '*.html' -o -name '*.css' -print \))

          grep -Fq 'SPDX-License-Identifier: MIT' test/fixtures/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' test/fixtures/README.md

          for file in doc/*.md; do
            grep -Fq 'SPDX-License-Identifier: MIT' "$file"
            grep -Fq 'Author: Sythos (https://www.sythos.net)' "$file"
          done

          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.server.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.server.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.lp4.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.lp4.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.lp5.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.lp5.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.lp7.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.lp7.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.lp8.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.lp8.json
          grep -Fq 'SPDX-License-Identifier: MIT' tsconfig.lp9.json
          grep -Fq 'Author: Sythos (https://www.sythos.net)' tsconfig.lp9.json
          grep -Fq 'SPDX-License-Identifier: MIT' web/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' web/README.md
          grep -Fq 'SPDX-License-Identifier: MIT' web/build.ts
          grep -Fq 'Author: Sythos (https://www.sythos.net)' web/build.ts
          grep -Fq 'SPDX-License-Identifier: MIT' web/test/web-shell.test.ts
          grep -Fq 'Author: Sythos (https://www.sythos.net)' web/test/web-shell.test.ts
          grep -Fq 'SPDX-License-Identifier: MIT' assets/README.md
          grep -Fq 'Author: Sythos (https://www.sythos.net)' assets/README.md
          node -e "const m=require('./web/manifest.json'); if (m.license !== 'MIT' || m.author !== 'Sythos (https://www.sythos.net)' || m.spdxLicenseIdentifier !== 'MIT') process.exit(1)"

          grep -Fq 'FORCE ROW LEVEL SECURITY' src/core/db/migrations/0001_m2_foundation.sql
          grep -Fq "set_config('gulogulo.tenant_id'" src/integrations/postgres-store.ts
          grep -Fq 'rejectUnauthorized: true' src/integrations/ldap-client.ts
          grep -Fq 'OPEN_RELAY_DISABLED' src/core/mail/mail-policy.ts
          grep -Fq 'FORWARDING_DISABLED' src/core/mail/mail-policy.ts
          grep -Fq "state === 'bounced'" src/core/mail/mail-queue.ts
          grep -Fq 'eventId' src/core/mail/imap-idle.ts
          grep -Fq 'fail-closed' doc/mail-core.md
          grep -Fq 'CONTENT_SCOPE_REQUIRED' src/core/dav/caldav/caldav-contract.ts
          grep -Fq 'SYNC_SCOPE_DENIED' src/core/dav/caldav/caldav-contract.ts
          grep -Fq 'SCOPE_ROLE_DENIED' src/core/dav/carddav/carddav-store.ts
          grep -Fq 'WELL_KNOWN_PATHS' src/core/dav/discovery/index.ts
          grep -Fq 'PLAINTEXT_DISCOVERY_FORBIDDEN' src/core/dav/discovery/index.ts
          grep -Fq 'id="login-shell"' web/index.html
          grep -Fq '/api/session/login' src/runtime/server.ts
          grep -Fq '/assets/gulo-gulo-calendar-mail.png' src/runtime/server.ts
          grep -Fq 'CONTENT_ACCESS_DENIED' src/core/admin/rbac.ts
          grep -Fq 'QUOTA_EXCEEDED' src/core/admin/quota.ts
          grep -Fq 'MASTER_LOG_ACCESS_DISABLED' src/core/admin/rbac.ts
          grep -Fq 'MAX_PASSWORD_EXPIRY_DAYS = 9999' src/core/auth/password-policy.ts
          grep -Fq 'REPLAYED_CODE' src/core/auth/totp.ts
          grep -Fq 'challenge' src/core/auth/webauthn.ts
          grep -Fq 'One-time recovery' src/core/auth/recovery-codes.ts
          grep -Fq 'DEFAULT_TRASH_RETENTION_DAYS = 28' src/core/lifecycle/retention.ts
          grep -Fq "BACKUP_ENCRYPTION_ALGORITHM = 'aes-256-gcm'" src/core/backup/backup-contract.ts
          grep -Fq 'PURGE_REJECTED' src/core/lifecycle/retention.ts
          grep -Fq 'createLogRotationPolicy' src/core/observability/log-policy.ts
          grep -Fq 'createStructuredEvent' src/core/observability/structured-event.ts
          grep -Fq 'createAlertPolicy' src/core/observability/alert-policy.ts
          grep -Fq 'DEFAULT_RATE_LIMITS' src/core/ops/abuse/index.ts
          grep -Fq 'createAbuseAuditEvent' src/core/ops/abuse/index.ts
          grep -Fq 'validateComposeProductionReadiness' src/core/ops/abuse/index.ts
          grep -Fq 'HOST_NAMESPACE_FORBIDDEN' src/core/ops/abuse/index.ts
          grep -Fq 'sanitizePatchStatus' src/core/ops/patch/status.ts
          grep -Fq 'gulogulo_abuse_limited_total' src/runtime/server.ts
          grep -Fq 'multiarchFunctionalProof' release/lp7-local-upgrade.json
          grep -Fq 'artifact_and_provenance_only' release/lp7-local-upgrade.json
          grep -Fq "BACKUP_ENCRYPTION_ALGORITHM = 'aes-256-gcm'" src/core/backup/backup-contract.ts
          grep -Fq 'DEFAULT_TRASH_RETENTION_DAYS = 28' src/core/lifecycle/retention.ts
          grep -Fq 'MIGRATION_PHASES' src/core/upgrade/compatibility.ts
          grep -Fq 'createSchemaMigrationPlan' src/core/upgrade/compatibility.ts
          grep -Fq 'ready_for_lp9' release/lp8-local-proof-bundle.json
          grep -Fq 'syntheticDataOnly' release/lp8-local-proof-bundle.json
          grep -Fq 'artifactProvenanceOnly' release/lp8-local-proof-bundle.json
          grep -Fq 'temporaryShims' release/lp8-local-proof-bundle.json
          grep -Fq 'LP9' release/lp8-local-proof-bundle.json
          grep -Fq 'REQUIRED_SECTION30_ITEMS' src/core/release/release-evidence.ts
          grep -Fq 'M10_REVIEWS_INCOMPLETE' src/core/release/release-evidence.ts
          grep -Fq 'productionReady' src/core/release/release-evidence.ts
          grep -Fq 'TypeScript' release/lp9-local-proof.json
          grep -Eq 'ready_for_owner_review|"status": "complete"' release/lp9-local-proof.json
          grep -Fq 'behaviorFreeMjsBridges' release/lp9-local-proof.json
          grep -Fq 'executableJavaScriptSources' scripts/lp9-source-audit.ts
          grep -Fq 'LP9_BRIDGE_NOT_THIN' scripts/lp9-source-audit.ts
          grep -Fq 'LP9_RELEASE_SOURCE_POLICY_INVALID' scripts/lp9-release-audit.ts

          grep -Fq 'SPDX-License-Identifier: MIT' config/schema.v1.json
          grep -Fq 'Sythos (https://www.sythos.net)' config/schema.v1.json
          grep -Fq 'atomic_active_pointer_replace' release/lp3-local-mail.json
          grep -Fq 'computeScannerSignatureContentDigest' src/core/mail/scanner-signatures.ts
          grep -Fq 'createControlPanelConfig' src/integrations/control-panel.ts
          grep -Fq 'Plesk' doc/control-panel-integration.md
          grep -Fq 'cPanel' doc/control-panel-integration.md
          grep -Fq 'providerOnly' config/schema.v1.json
          grep -Fq 'arbitraryCommands' config/schema.v1.json

          for file in test/fixtures/*.json; do
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (data.spdxLicenseIdentifier !== 'MIT' || data.author !== 'Sythos (https://www.sythos.net)' || data.deterministic !== true) process.exit(1);" "$file"
          done

          if grep -Eq '^(LDAP_BIND_PASSWORD|POSTGRES_PASSWORD|[A-Z_]*(TOKEN|PASSWORD|PRIVATE_KEY))=' .env.example; then
            echo 'Credential values must not be present in .env.example.' >&2
            exit 1
          fi

          node -e "const p=require('./package.json'); if (p.license !== 'MIT' || p.author !== 'Sythos (https://www.sythos.net)' || p.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const p=require('./package-lock.json'); const root=p.packages && p.packages['']; if (!root || root.license !== 'MIT' || root.author !== 'Sythos (https://www.sythos.net)' || root.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const s=require('./config/schema.v1.json'); if (!s.properties.buildDigest || !s.properties.patching) process.exit(1)"
          test -f package-lock.json
          node -e "const e=require('./release/v1-release-evidence.template.json'); if (e.spdxLicenseIdentifier !== 'MIT' || e.author !== 'Sythos (https://www.sythos.net)' || e.product !== 'Gulo Gulo') process.exit(1)"
          node -e "const s=require('./release/local-proof-scope.json'); if (s.spdxLicenseIdentifier !== 'MIT' || s.author !== 'Sythos (https://www.sythos.net)' || s.proofType !== 'local' || s.networkPolicy !== 'offline_runtime' || s.syntheticDataOnly !== true || s.publicDnsRequired !== false || s.publicAcmeEnabled !== false || s.externalPhaseDeferred !== true) process.exit(1)"
