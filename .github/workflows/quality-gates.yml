name: Quality gates

on:
  workflow_call:
    inputs:
      context:
        description: Execution context for the quality gates
        required: true
        type: string
      architecture_mode:
        description: Fast amd64 validation by default; select multiarch for the final arm64 gate
        required: false
        default: amd64
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  repository-quality:
    name: Repository quality gates (${{ inputs.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHITECTURE_MODE: ${{ inputs.architecture_mode || 'amd64' }}
      BUILD_PLATFORMS: ${{ inputs.architecture_mode == 'multiarch' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...$COMMIT_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
            # A force-pushed milestone branch can legitimately remove the
            # event's before-object from the Actions checkout. Fall back to
            # checking the pushed commit instead of failing on a missing
            # historical object.
            if git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
              git diff --check "$EVENT_BEFORE" "$COMMIT_SHA"
            else
              git show --check --pretty= "$COMMIT_SHA"
            fi
          else
            git show --check --pretty= "$COMMIT_SHA"
          fi

      - name: Validate repository entry points
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARCHITECTURE_MODE" == "amd64" || "$ARCHITECTURE_MODE" == "multiarch" ]]
          test -f LICENSE
          grep -Fq 'MIT License' LICENSE
          test -f README.md
          grep -Fxq '# Gulo Gulo' README.md
          test -f assets/README.md
          test -f assets/gulo-gulo-calendar-mail.png
          test -f scripts/m0-smoke.ps1
          test -f scripts/m1-fixture-smoke.ps1
          test -f test/fixtures/manifest.json
          test -f test/fixtures/tenant.json
          test -f test/fixtures/failure-modes.json
          test -f test/fixtures/README.md
          test -f scripts/container-patch.sh
          test -f config/schema.v1.json
          test -f doc/README.md
          test -f doc/configuration.md
          test -f doc/observability.md
          test -f doc/compose-and-fixtures.md
          test -f doc/container-patching.md
          test -f doc/api-and-mcp.md
          test -f doc/identity-and-postgres.md
