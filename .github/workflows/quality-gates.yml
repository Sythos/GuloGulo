          grep -Fq 'providerOnly' config/schema.v1.json
          grep -Fq 'arbitraryCommands' config/schema.v1.json
          bash -n scripts/container-patch.sh

          for file in test/fixtures/*.json; do
            node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (data.spdxLicenseIdentifier !== 'MIT' || data.author !== 'Sythos (https://www.sythos.net)' || data.deterministic !== true) process.exit(1);" "$file"
          done

          if grep -Eq '^(LDAP_BIND_PASSWORD|POSTGRES_PASSWORD|[A-Z_]*(TOKEN|PASSWORD|PRIVATE_KEY))=' .env.example; then
            echo 'Credential values must not be present in .env.example.' >&2
            exit 1
          fi

          node -e "const p=require('./package.json'); if (p.license !== 'MIT' || p.author !== 'Sythos (https://www.sythos.net)' || p.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const p=require('./package-lock.json'); const root=p.packages && p.packages['']; if (!root || root.license !== 'MIT' || root.author !== 'Sythos (https://www.sythos.net)' || root.spdxLicenseIdentifier !== 'MIT') process.exit(1)"
          node -e "const s=require('./config/schema.v1.json'); if (!s.properties.buildDigest || !s.properties.patching) process.exit(1)"
          test -f package-lock.json
          node -e "const e=require('./release/v1-release-evidence.template.json'); if (e.spdxLicenseIdentifier !== 'MIT' || e.author !== 'Sythos (https://www.sythos.net)' || e.product !== 'Gulo Gulo') process.exit(1)"
          node -e "const s=require('./release/local-proof-scope.json'); if (s.spdxLicenseIdentifier !== 'MIT' || s.author !== 'Sythos (https://www.sythos.net)' || s.proofType !== 'local' || s.networkPolicy !== 'offline_runtime' || s.syntheticDataOnly !== true || s.publicDnsRequired !== false || s.publicAcmeEnabled !== false || s.externalPhaseDeferred !== true) process.exit(1)"
          node -e "const t=require('./release/local-proof-topology.json'); if (t.spdxLicenseIdentifier !== 'MIT' || t.author !== 'Sythos (https://www.sythos.net)' || t.milestone !== 'LP1' || t.networkPolicy !== 'offline_runtime' || t.internalNetwork !== true || t.ipFamilies?.join(',') !== 'ipv4,ipv6' || t.publicDnsRequired !== false || t.publicAcmeEnabled !== false || t.dockerSocketMounted !== false) process.exit(1)"
          node -e "const t=require('./release/lp2-local-services.json'); if (t.spdxLicenseIdentifier !== 'MIT' || t.author !== 'Sythos (https://www.sythos.net)' || t.milestone !== 'LP2' || t.proofType !== 'local_synthetic' || t.networkPolicy !== 'offline_dependencies' || t.internalNetwork !== true || t.enableIpv6 !== true || t.ipFamilies?.join(',') !== 'ipv4,ipv6' || t.publicDnsRequired !== false || t.publicAcmeEnabled !== false || t.hostPortsPublished !== false || t.dockerSocketMounted !== false) process.exit(1)"
          node -e "const t=require('./release/lp3-local-mail.json'); if (t.spdxLicenseIdentifier !== 'MIT' || t.author !== 'Sythos (https://www.sythos.net)' || t.milestone !== 'LP3' || t.proofType !== 'local_synthetic_mail' || t.networkPolicy !== 'offline_dependencies' || t.internalNetwork !== true || t.enableIpv6 !== true || t.ipFamilies?.join(',') !== 'ipv4,ipv6' || t.syntheticDataOnly !== true || t.publicDnsRequired !== false || t.publicAcmeEnabled !== false || t.externalDeliveryEnabled !== false || t.hostPortsPublished !== false || t.dockerSocketMounted !== false || t.policy?.catchAll !== false || t.policy?.automaticForwarding !== false || t.policy?.scanFailureMode !== 'fail_closed' || t.policy?.trashRetentionDays !== 28 || t.protocols?.imap?.idle !== true || t.protocols?.lmtp?.quotaReservationBeforeAck !== true || t.protocols?.sieve?.redirect !== false) process.exit(1)"
          node -e "const t=require('./release/lp4-local-web.json'); if (t.spdxLicenseIdentifier !== 'MIT' || t.author !== 'Sythos (https://www.sythos.net)' || t.milestone !== 'LP4' || t.proofType !== 'local_synthetic_web_dav' || t.networkPolicy !== 'offline_dependencies' || t.internalNetwork !== true || t.enableIpv6 !== true || t.ipFamilies?.join(',') !== 'ipv4,ipv6' || t.syntheticDataOnly !== true || t.publicDnsRequired !== false || t.publicAcmeEnabled !== false || t.hostPortsPublished !== false || t.dockerSocketMounted !== false || t.credentialsCommitted !== false || t.web?.sameOriginOnly !== true || t.session?.csrfOnAuthenticatedMutations !== true || t.dav?.tenantBoundEtags !== true || t.dav?.tenantBoundSyncTokens !== true || t.dav?.masterContentAccess !== false || t.discovery?.tenantBound !== true || t.architectureValidation?.defaultWorkflowMode !== 'amd64' || t.architectureValidation?.finalWorkflowMode !== 'multiarch' || t.architectureValidation?.arm64RequiredBeforeMergeOrRelease !== true || t.architectureValidation?.composeProofPlatform !== 'linux/amd64') process.exit(1)"
          bash -n docker/lp1-network/entrypoint-ca.sh
          bash -n docker/lp1-network/entrypoint-dns.sh
          bash -n docker/lp2-tls/entrypoint-tls.sh
          bash -n docker/lp2-ldap/entrypoint-ldap.sh
          bash -n docker/lp2-ldap/healthcheck-ldap.sh
          bash -n docker/lp2-postgres/entrypoint-postgres.sh
          bash -n docker/lp2-postgres/healthcheck-postgres.sh
          bash -n docker/lp3-tls/entrypoint-tls.sh
          bash -n docker/lp3-postfix/entrypoint-postfix.sh
          bash -n docker/lp3-postfix/healthcheck-postfix.sh
          bash -n docker/lp3-dovecot/entrypoint-dovecot.sh
          bash -n docker/lp3-dovecot/healthcheck-dovecot.sh
          bash -n docker/lp3-rspamd/healthcheck-rspamd.sh
          bash -n docker/lp3-clamav/healthcheck-clamav.sh

      - name: Set up Node.js when package metadata exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install dependencies and run the test script when available
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            corepack pnpm install --frozen-lockfile --ignore-scripts --config.auto-install-peers=false
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable --mode=skip-builds
          else
            node -e "const p=require('./package.json'); if (Object.keys(p.dependencies || {}).length || Object.keys(p.devDependencies || {}).length || Object.keys(p.optionalDependencies || {}).length) { console.error('A lockfile is required when package dependencies are declared.'); process.exit(1); }"
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

          if node -e "const packageData = require('./package.json'); process.exit(packageData.scripts && packageData.scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No package test script is defined; repository checks remain active."
          fi

      - name: Run Docker Compose M0 smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m0-smoke.ps1

      - name: Set up QEMU for Ubuntu multi-architecture builds
        if: hashFiles('Dockerfile') != '' && inputs.architecture_mode == 'multiarch'
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v4.2.0

      - name: Validate Ubuntu 26.04 LTS images (${{ inputs.architecture_mode || 'amd64' }})
        if: hashFiles('Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gulogulo-ubuntu-26.04.oci.tar"
          docker buildx build \
            --platform "$BUILD_PLATFORMS" \
            --pull \
            --build-arg NODE_VERSION=26.7.0 \
            --provenance=false \
            --sbom=false \
            --tag gulogulo:ci-ubuntu-26.04 \
            --output "type=oci,dest=$output" \
            .
          test -s "$output"

      - name: Validate LP1 network utility image (${{ inputs.architecture_mode || 'amd64' }})
        if: hashFiles('docker/lp1-network/Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gulogulo-lp1-network-ubuntu-26.04.oci.tar"
          docker buildx build \
            --platform "$BUILD_PLATFORMS" \
            --pull \
            --provenance=false \
            --sbom=false \
            --tag gulogulo:ci-lp1-network-ubuntu-26.04 \
            --file docker/lp1-network/Dockerfile \
            --output "type=oci,dest=$output" \
            docker/lp1-network
          test -s "$output"

      - name: Run Compose test profile
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail

          project="gulogulo-ci-test-${GITHUB_RUN_ID}"
          compose=(docker compose --project-name "$project" --file compose.yaml --env-file .env.example)
          cleanup() {
            "${compose[@]}" --profile test down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${compose[@]}" --profile local config --quiet
          "${compose[@]}" --profile test config --quiet
          "${compose[@]}" --profile test build --pull gulogulo-test
          "${compose[@]}" --profile test run --rm --no-deps gulogulo-test

      - name: Run LP1 isolated local proof topology
        if: hashFiles('docker/lp1-network/Dockerfile') != '' && hashFiles('scripts/lp1-proof-smoke.mjs') != ''
        shell: bash
        run: npm run test:lp1:docker

      - name: Run LP2 static Compose audit
        if: hashFiles('scripts/lp2-compose-audit.mjs') != ''
        shell: bash
        run: node scripts/lp2-compose-audit.mjs

      - name: Validate LP2 dependency images (${{ inputs.architecture_mode || 'amd64' }})
        if: hashFiles('docker/lp2-tls/Dockerfile') != '' && hashFiles('docker/lp2-ldap/Dockerfile') != '' && hashFiles('docker/lp2-postgres/Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r name dockerfile context; do
            output="$RUNNER_TEMP/gulogulo-${name}-ubuntu-26.04.oci.tar"
            docker buildx build \
              --platform "$BUILD_PLATFORMS" \
              --pull \
              --provenance=false \
              --sbom=false \
              --tag "gulogulo:ci-${name}-ubuntu-26.04" \
              --file "$dockerfile" \
              --output "type=oci,dest=$output" \
              "$context"
            test -s "$output"
          done <<'EOF'
          lp2-tls|docker/lp2-tls/Dockerfile|docker/lp2-tls
          lp2-ldap|docker/lp2-ldap/Dockerfile|docker/lp2-ldap
          lp2-postgres|docker/lp2-postgres/Dockerfile|docker/lp2-postgres
          EOF

      - name: Run LP2 synthetic LDAP and PostgreSQL proof
        if: hashFiles('scripts/lp2-compose-smoke.mjs') != ''
        shell: bash
        run: npm run test:lp2:docker

      - name: Run LP3 static Compose and TypeScript audit
        if: hashFiles('scripts/lp3-compose-audit.mjs') != ''
        shell: bash
        run: node scripts/lp3-compose-audit.mjs

      - name: Run LP3 typed mail contract gates
        if: hashFiles('src/mail/mail-core.test.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:server
          npm run test:lp3

      - name: Run LP4 static and typed web/DAV contract gates
        if: hashFiles('scripts/lp4-compose-audit.ts') != ''
        shell: bash
        run: npm run test:lp4

      # The Compose proof runs on the amd64 GitHub runner. Keep it before the
      # emulated arm64 build so a functional regression fails quickly without
      # spending another long QEMU build first.
      - name: Run LP3 local mail Compose proof (amd64)
        if: hashFiles('scripts/lp3-compose-smoke.mjs') != '' && hashFiles('compose.yaml') != ''
        shell: bash
        run: node scripts/lp3-compose-smoke.mjs

      # LP4 remains an amd64 live proof on GitHub; the root image is already
      # validated for both architectures by the multi-architecture build.
      - name: Run LP4 local web and DAV Compose proof (amd64)
        if: hashFiles('scripts/lp4-compose-smoke.ts') != '' && hashFiles('compose.yaml') != ''
        shell: bash
        run: npm run test:lp4:docker

      - name: Validate LP3 mail images on amd64
        if: hashFiles('docker/lp3-tls/Dockerfile') != '' && hashFiles('docker/lp3-postfix/Dockerfile') != '' && hashFiles('docker/lp3-dovecot/Dockerfile') != '' && hashFiles('docker/lp3-rspamd/Dockerfile') != '' && hashFiles('docker/lp3-clamav/Dockerfile') != '' && hashFiles('docker/lp3-proof/Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r name dockerfile context; do
            output="$RUNNER_TEMP/gulogulo-${name}-amd64-ubuntu-26.04.oci.tar"
            docker buildx build \
              --platform linux/amd64 \
              --pull \
              --provenance=false \
              --sbom=false \
              --tag "gulogulo:ci-${name}-ubuntu-26.04" \
              --file "$dockerfile" \
              --output "type=oci,dest=$output" \
              "$context"
            test -s "$output"
          done <<'EOF'
          lp3-tls|docker/lp3-tls/Dockerfile|docker/lp3-tls
          lp3-postfix|docker/lp3-postfix/Dockerfile|docker/lp3-postfix
          lp3-dovecot|docker/lp3-dovecot/Dockerfile|docker/lp3-dovecot
          lp3-rspamd|docker/lp3-rspamd/Dockerfile|docker/lp3-rspamd
          lp3-clamav|docker/lp3-clamav/Dockerfile|docker/lp3-clamav
          lp3-proof|docker/lp3-proof/Dockerfile|docker/lp3-proof
          EOF

      - name: Validate LP3 mail images on arm64 (final multiarch gate)
        if: inputs.architecture_mode == 'multiarch' && hashFiles('docker/lp3-tls/Dockerfile') != '' && hashFiles('docker/lp3-postfix/Dockerfile') != '' && hashFiles('docker/lp3-dovecot/Dockerfile') != '' && hashFiles('docker/lp3-rspamd/Dockerfile') != '' && hashFiles('docker/lp3-clamav/Dockerfile') != '' && hashFiles('docker/lp3-proof/Dockerfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r name dockerfile context; do
            output="$RUNNER_TEMP/gulogulo-${name}-arm64-ubuntu-26.04.oci.tar"
            docker buildx build \
              --platform linux/arm64 \
              --pull \
              --provenance=false \
              --sbom=false \
              --tag "gulogulo:ci-${name}-arm64-ubuntu-26.04" \
              --file "$dockerfile" \
              --output "type=oci,dest=$output" \
              "$context"
            test -s "$output"
          done <<'EOF'
          lp3-tls|docker/lp3-tls/Dockerfile|docker/lp3-tls
          lp3-postfix|docker/lp3-postfix/Dockerfile|docker/lp3-postfix
          lp3-dovecot|docker/lp3-dovecot/Dockerfile|docker/lp3-dovecot
          lp3-rspamd|docker/lp3-rspamd/Dockerfile|docker/lp3-rspamd
          lp3-clamav|docker/lp3-clamav/Dockerfile|docker/lp3-clamav
          lp3-proof|docker/lp3-proof/Dockerfile|docker/lp3-proof
          EOF

      - name: Generate OCI artifact attestations
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('Dockerfile') != '' && hashFiles('docker/lp3-proof/Dockerfile') != ''
        uses: actions/attest-build-provenance@v4
        id: attest-oci
        with:
          subject-path: ${{ runner.temp }}/gulogulo-*.oci.tar

      - name: Verify OCI artifact attestations with GitHub CLI
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('Dockerfile') != '' && hashFiles('docker/lp3-proof/Dockerfile') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP"/gulogulo-*.oci.tar)
          ((${#artifacts[@]} > 0))
          for artifact in "${artifacts[@]}"; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Run disposable PostgreSQL M2 integration contract
        if: hashFiles('src/integrations/postgres.integration.test.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          container="gulogulo-m2-postgres-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_DB=gulogulo \
            --env POSTGRES_USER=gulogulo \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18 >/dev/null
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready --username=gulogulo --dbname=gulogulo >/dev/null
          GULOGULO_M2_POSTGRES_DSN="postgresql://gulogulo@$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container"):5432/gulogulo" npm run test:m2:postgres

      - name: Run M1 fixture, health, and metrics smoke checks
        if: hashFiles('compose.yaml') != '' || hashFiles('compose.yml') != '' || hashFiles('docker-compose.yml') != '' || hashFiles('docker-compose.yaml') != ''
        shell: pwsh
        run: ./scripts/m1-fixture-smoke.ps1 -RequireMetrics

      - name: Report Docker smoke-check status when Compose is not defined
        if: hashFiles('compose.yaml') == '' && hashFiles('compose.yml') == '' && hashFiles('docker-compose.yml') == '' && hashFiles('docker-compose.yaml') == ''
        shell: bash
        run: echo "No Compose file exists yet; M0 Docker smoke checks are deferred until the Docker-first scaffold is added."

      - name: Report package-test status when no package exists
        if: hashFiles('package.json') == ''
        shell: bash
        run: echo "No package.json exists yet; package tests are deferred until implementation is added."
