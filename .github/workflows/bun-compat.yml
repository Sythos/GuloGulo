# Experimental probe for the bun-engine exploration: does Gulo Gulo's
# compiled server, and its highest-risk hand-rolled socket/TLS code (the
# IMAP/SMTP protocol clients and the webhook alert adapter, all built
# directly on node:net/node:tls/node:http rather than a library), actually
# run under Bun's Node-compat layer? Probes 1-5 target that highest-risk
# code specifically; probe 6 widens the check to every *.test.ts in the
# repository (the same tests npm test runs under node --experimental-strip-
# types today, run under bun test instead), including the ldapts/pg
# dependency imports. Building still uses the normal Node/npm toolchain;
# only the run/test step switches to Bun. Every probe step is allowed to
# fail independently and the final step prints a clear pass/fail summary,
# since the goal here is real data, not a green checkmark.
name: Bun compatibility probe

on:
  push:
    branches:
      - bun-engine
  pull_request:
    branches:
      - bun-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe Bun compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js (build toolchain only)
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Set up Bun (runtime under test)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and build (Node/npm, unchanged)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:web
          npm run build:server

      - name: Report Bun version under test
        shell: bash
        run: bun --version

      - name: Probe 1 - boot the compiled server under Bun
        id: probe_boot
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          bun dist/server/src/runtime/index.js > bun-server.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 1 ] && curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "--- server log ---"
            cat bun-server.log || true
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Probe 2 - IMAP IDLE adapter test (hand-rolled node:net/node:tls client)
        id: probe_imap
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if bun test src/core/mail/imap-idle-adapter.test.ts; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe 3 - SMTP queue adapter test (hand-rolled node:net/node:tls client)
        id: probe_smtp
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if bun test src/core/mail/smtp-queue-adapter.test.ts; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe 4 - webhook alert adapter test (real node:http server)
        id: probe_webhook
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if bun test src/core/observability/webhook-alert-adapter.test.ts; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe 5 - DAV contract tests (pure logic, lowest risk)
        id: probe_dav
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if bun test src/core/dav/caldav/caldav-contract.test.ts src/core/dav/carddav/carddav-store.test.ts; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe 6 - the entire repository test suite under bun test
        id: probe_full
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          # Every *.test.ts in the repo, run under bun test instead of node
          # --experimental-strip-types. postgres.integration.test.ts
          # self-skips without GULOGULO_M2_POSTGRES_DSN, same as it does in
          # every other CI workflow today.
          mapfile -t TEST_FILES < <(find . -path ./node_modules -prune -o -name '*.test.ts' -print | sort)
          echo "Running ${#TEST_FILES[@]} test files under bun test"
          bun test "${TEST_FILES[@]}" 2>&1 | tee bun-full-suite.log
          FULL_EXIT="${PIPESTATUS[0]}"
          {
            echo "result=$([ "$FULL_EXIT" -eq 0 ] && echo pass || echo fail)"
          } >> "$GITHUB_OUTPUT"
          tail -n 40 bun-full-suite.log

      - name: Compatibility summary
        shell: bash
        run: |
          {
            echo "## Bun compatibility probe"
            echo ""
            echo "| Probe | Result |"
            echo "|---|---|"
            echo "| Server boots under \`bun\` and answers /health/ready and / | ${{ steps.probe_boot.outputs.result }} |"
            echo "| IMAP IDLE adapter test (node:net/node:tls client) | ${{ steps.probe_imap.outputs.result }} |"
            echo "| SMTP queue adapter test (node:net/node:tls client) | ${{ steps.probe_smtp.outputs.result }} |"
            echo "| Webhook alert adapter test (real node:http server) | ${{ steps.probe_webhook.outputs.result }} |"
            echo "| DAV contract tests (pure logic, no I/O) | ${{ steps.probe_dav.outputs.result }} |"
            echo "| Full repository test suite (every \`*.test.ts\`, \`bun test .\`) | ${{ steps.probe_full.outputs.result }} |"
            echo ""
            echo "This is an exploratory probe on the \`bun-engine\` branch only."
            echo "A \`fail\` here means real, observed incompatibility under Bun -"
            echo "not a guess - and blocks treating Bun as a supported runtime"
            echo "until it is fixed or worked around."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.probe_boot.outputs.result }}" != "pass" ] || \
             [ "${{ steps.probe_imap.outputs.result }}" != "pass" ] || \
             [ "${{ steps.probe_smtp.outputs.result }}" != "pass" ] || \
             [ "${{ steps.probe_webhook.outputs.result }}" != "pass" ] || \
             [ "${{ steps.probe_dav.outputs.result }}" != "pass" ] || \
             [ "${{ steps.probe_full.outputs.result }}" != "pass" ]; then
            echo "One or more Bun compatibility probes failed; see the summary above." >&2
            exit 1
          fi
