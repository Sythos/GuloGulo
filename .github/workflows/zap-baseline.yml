# Runs an OWASP ZAP Baseline Scan against the compiled server, booted the
# same way package-standalone.yml boots it for its own install rehearsal
# (safe defaults, LDAP/Postgres disabled) - a passive/light-active scan of
# whatever an unauthenticated crawl can reach: /, /health*, /readyz,
# /metrics, static web assets, and the login form itself. It cannot exercise
# anything behind a session (mail/calendar/contacts, DAV, the admin API),
# since ZAP never authenticates here - this is a real but partial check of
# the public surface (security headers, common web vulnerability classes,
# TLS-adjacent findings), not proof the authenticated app is safe. Nothing
# is uploaded to a third-party service: ZAP runs entirely inside the runner
# and the report is kept as a workflow artifact.
#
# fail_action is deliberately false for this first rollout: unlike the
# ESLint adoption (which reviewed every real finding before deciding what
# blocks CI), no baseline run against this app has happened yet, so there is
# no triaged data to decide a fail threshold from. The workflow always
# completes and always uploads the report; treat the first few real runs as
# the triage pass, then flip fail_action (or add a ZAP alert-filter rules
# file to allow specific reviewed findings) once what a clean run actually
# looks like here is known - not before.
name: OWASP ZAP baseline scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-scan:
    name: Scan the booted server with ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:web
          npm run build:server

      - name: Boot the server with safe defaults
        shell: bash
        run: |
          set -euo pipefail
          node dist/server/src/runtime/index.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Server did not become ready in time." >&2
            cat server.log >&2 || true
            exit 1
          fi

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8080'
          # -a spiders ajax-rendered links too (the frontend is a single
          # compiled bundle, not server-rendered pages, so this matters);
          # -j uses the ajax spider specifically; -I keeps informational
          # alerts out of the pass/fail decision, kept for visibility in the
          # report without failing the job on pure noise.
          cmd_options: '-a -j -I'
          # The scanning container needs to reach the runner's own bridge
          # network, not just localhost inside itself.
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: false
          fail_action: false

      - name: Stop the server
        if: always()
        shell: bash
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
