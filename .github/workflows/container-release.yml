name: Container release (SBOM and attestations)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      architecture_mode:
        description: Build the fast amd64 field image or the final amd64+arm64 image
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - multiarch
      publish:
        description: Push an immutable GHCR image and publish its attestations (main only)
        type: boolean
        required: true
        default: false
      release_tag:
        description: Lowercase immutable release tag; blank uses the short commit SHA
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR image references must be lowercase even when the GitHub owner/repository use mixed case.
  IMAGE_NAME: ghcr.io/sythos/gulogulo

jobs:
  field-container:
    name: Build amd64 field-test container
    if: github.event_name == 'workflow_dispatch' && inputs.publish != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enforce the field-image architecture contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.architecture_mode }}' != 'amd64' ]]; then
            echo 'The downloadable field-test image is intentionally amd64-only. Use publish=true for the multiarch registry image.' >&2
            exit 1
          fi

      - name: Resolve field image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          if [[ -z "$tag" ]]; then tag="field-${GITHUB_SHA:0:12}"; fi
          [[ "$tag" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "local_tag=gulogulo:field-$tag" >> "$GITHUB_OUTPUT"

      - name: Build the amd64 container for field testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local_tag }}
          pull: true
          provenance: false

      - name: Generate the field-image SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        id: sbom
        with:
          image: ${{ steps.meta.outputs.local_tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/gulogulo-field-${{ steps.meta.outputs.tag }}.spdx.json
          artifact-name: gulogulo-field-${{ steps.meta.outputs.tag }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Validate the generated field-image SBOM
        shell: bash
        env:
          SBOM_PATH: ${{ runner.temp }}/gulogulo-field-${{ steps.meta.outputs.tag }}.spdx.json
        run: node --experimental-strip-types scripts/sbom-release-audit.ts --sbom "$SBOM_PATH"

      - name: Export the amd64 field image and checksum
        shell: bash
        env:
          LOCAL_TAG: ${{ steps.meta.outputs.local_tag }}
          IMAGE_TAR: ${{ runner.temp }}/gulogulo-field-${{ steps.meta.outputs.tag }}.docker.tar
        run: |
          set -euo pipefail
          docker save "$LOCAL_TAG" --output "$IMAGE_TAR"
          sha256sum "$IMAGE_TAR" > "$IMAGE_TAR.sha256"

      - name: Upload the field-test container artifact
        uses: actions/upload-artifact@v4
        with:
          name: gulogulo-field-${{ steps.meta.outputs.tag }}-amd64-container
          path: |
            ${{ runner.temp }}/gulogulo-field-${{ steps.meta.outputs.tag }}.docker.tar
            ${{ runner.temp }}/gulogulo-field-${{ steps.meta.outputs.tag }}.docker.tar.sha256
          if-no-files-found: error
          retention-days: 14

  publish-container:
    name: Publish immutable registry image and attestations
    if: (github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      PLATFORMS: ${{ (github.event_name == 'push' || inputs.architecture_mode == 'multiarch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - name: Checkout the trusted main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate automatic version tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Automatic container publication requires a numeric semver tag (received $tag)." >&2
            exit 1
          }
          package_version="$(jq -r '.version' package.json)"
          [[ "$package_version" != "null" && "$tag" == "$package_version" ]] || {
            echo "Tag $tag must exactly match package.json version $package_version." >&2
            exit 1
          }

      - name: Set up QEMU for the final multiarch artifact gate
        if: github.event_name == 'push' || inputs.architecture_mode == 'multiarch'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve the immutable release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -z "$tag" ]]; then tag="release-${GITHUB_SHA:0:12}"; fi
          [[ "$tag" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Enforce final multiarch release target
        if: github.event_name == 'workflow_dispatch' && inputs.architecture_mode != 'multiarch'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Registry publication is reserved for the final linux/amd64 + linux/arm64 target.' >&2
          exit 1

      - name: Log in to the public GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the immutable image with BuildKit SBOM metadata
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true

      - name: Generate the SPDX SBOM for the exact pushed digest
        id: sbom
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}.spdx.json
          artifact-name: gulogulo-${{ steps.meta.outputs.tag }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Validate the published-image SBOM
        shell: bash
        env:
          SBOM_PATH: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}.spdx.json
        run: node --experimental-strip-types scripts/sbom-release-audit.ts --sbom "$SBOM_PATH"

      - name: Attest the SBOM against the exact image digest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance against the exact image digest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify the published SBOM attestation from the consumer path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Publish the digest-bound release evidence
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            --arg platforms "$PLATFORMS" \
            '{repository:$repository, commit:$commit, image:$image, tag:$tag, digest:$digest, platforms:($platforms|split(",")), sbomFormat:"spdx-json", status:"verified"}' \
            > "$RUNNER_TEMP/gulogulo-$TAG-release-evidence.json"
          cat "$RUNNER_TEMP/gulogulo-$TAG-release-evidence.json"

      - name: Upload digest-bound release evidence
        uses: actions/upload-artifact@v4
        with:
          name: gulogulo-${{ steps.meta.outputs.tag }}-release-evidence
          path: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}-release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Create or update the GitHub Release for the version tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORMS: ${{ env.PLATFORMS }}
          SBOM_PATH: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}.spdx.json
          EVIDENCE_PATH: ${{ runner.temp }}/gulogulo-${{ steps.meta.outputs.tag }}-release-evidence.json
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/gulogulo-$TAG-release-notes.md"
          {
            echo "## Container image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Platforms: \`$PLATFORMS\`"
            echo
            echo "SBOM and GitHub Artifact Attestations are bound to this immutable digest."
            if [[ "$TAG" == "0.1.3" ]]; then
              echo
              echo "This 0.1.3 increment is a fictitious artifact-generation release; it is not production evidence."
            fi
          } > "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SBOM_PATH" "$EVIDENCE_PATH" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$SBOM_PATH" "$EVIDENCE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Gulo Gulo $TAG" \
              --notes-file "$notes" \
              --verify-tag
          fi
