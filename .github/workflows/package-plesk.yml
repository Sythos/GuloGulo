name: Package Plesk archive

# This target (packaging/plesk/) no longer builds a Plesk "extension" ZIP -
# it builds a real Debian `.deb` package (see packaging/plesk/build-plesk-
# package.ts and INSTALL.md for why the Plesk extension mechanism was
# retired in favor of an OS-native package). Runs inside a real
# `debian:trixie` container (not the ubuntu-latest runner the other two
# package-*.yml workflows use) so the whole pipeline - Node.js install via
# the NodeSource setup_26.x script, `dpkg-deb --build`, `dpkg -c`/`dpkg-deb
# -I` inspection, `dpkg --unpack` - runs on the actual target OS this
# package is meant for, not a stand-in.
#
# What this workflow CANNOT do: run this package's postinst to completion.
# postinst ends with `systemctl daemon-reload && systemctl enable --now
# gulogulo`, and a plain `debian:trixie` container has no running init
# system (no PID 1 systemd, no D-Bus) - `systemctl` simply has nothing to
# talk to. So instead of a full `dpkg -i`/`apt install ./*.deb`, this
# workflow does the closest safe approximation: `dpkg --unpack` (which
# really extracts the real payload to /opt/gulogulo and proves the archive
# is structurally installable) followed by `dpkg --purge` (which exercises
# prerm/postrm's "package was never configured" no-op paths for real,
# without ever reaching postinst's systemd calls). The full install -
# postinst's npm ci / migrations / system user / systemd enable, actually
# reaching an HTTP-serving process - has NOT been exercised end to end on a
# real host by this workflow and remains field work; see INSTALL.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-plesk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify-package:
    name: Build the .deb package and verify its structure
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    steps:
      # actions/checkout needs git, and this is a bare debian:trixie
      # container image - neither git nor the NodeSource setup script's own
      # prerequisites (curl, ca-certificates, gnupg) are present by default.
      # dpkg-deb itself needs nothing extra (it is part of dpkg, which is
      # essential and always present); dpkg-dev is installed anyway per
      # this project's packaging notes, even though `dpkg-deb --build` does
      # not strictly require it.
      - name: Install build prerequisites (apt)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl gnupg dpkg-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Compito 1 research: NodeSource publishes a genuine `setup_26.x` DEB
      # repo script (https://github.com/nodesource/distributions), which
      # does not hardcode a Debian codename allowlist - it only checks for
      # /etc/debian_version and installs its own generic apt source, so it
      # is expected to work on Trixie even though NodeSource has not
      # explicitly certified Trixie support. This step is that claim's
      # actual verification: if setup_26.x stops working on Trixie, this
      # job fails here rather than that assumption going unchecked.
      - name: Install Node.js 26.x (NodeSource)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_26.x -o /tmp/nodesource_setup.sh
          bash /tmp/nodesource_setup.sh
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build web and server bundles
        shell: bash
        run: |
          set -euo pipefail
          npm run build:web
          npm run build:server

      - name: Build the .deb package
        shell: bash
        env:
          GULOGULO_SKIP_BUILD: "1"
        run: node --experimental-strip-types packaging/plesk/build-plesk-package.ts

      - name: Resolve the built package path
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(ls packaging/dist/gulogulo_*_all.deb)"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Verify the package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd packaging/dist
          ARCHIVE_NAME="$(basename "$(ls gulogulo_*_all.deb)")"
          test -f "${ARCHIVE_NAME}.sha256"
          sha256sum -c "${ARCHIVE_NAME}.sha256"

      - name: Inspect package metadata (dpkg-deb -I)
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb -I "$DEB"

          INFO="$(dpkg-deb -I "$DEB")"
          echo "$INFO" | grep -qE '^ *Package: gulogulo$'
          echo "$INFO" | grep -qE '^ *Architecture: all$'
          echo "$INFO" | grep -qE '^ *Maintainer: Sythos <sythos@gmail\.com>$'
          echo "$INFO" | grep -qE '^ *Depends: systemd$'

          # The control template's @VERSION@ placeholder must have been
          # substituted with a real version.
          if echo "$INFO" | grep -q '@VERSION@'; then
            echo "DEBIAN/control still contains an unsubstituted @VERSION@ placeholder." >&2
            exit 1
          fi

      - name: Verify package contents (dpkg -c)
        shell: bash
        run: |
          set -euo pipefail
          CONTENTS="$(dpkg -c "$DEB")"
          echo "$CONTENTS"

          for path in \
            ./opt/gulogulo/dist/server/src/runtime/index.js \
            ./opt/gulogulo/web/index.html \
            ./opt/gulogulo/web/dist/app.js \
            ./opt/gulogulo/assets/gulo-gulo-calendar-mail.png \
            ./opt/gulogulo/src/core/db/migrations/0001_m2_foundation.sql \
            ./opt/gulogulo/.env.example \
            ./opt/gulogulo/VERSION \
            ./opt/gulogulo/package.json \
            ./opt/gulogulo/run-migrations.mjs \
            ./opt/gulogulo/gulogulo.service.template \
            ./opt/gulogulo/gulogulo-proxy.conf.example \
          ; do
            echo "$CONTENTS" | grep -qF " $path" || { echo "Missing from package payload: $path" >&2; exit 1; }
          done

      - name: Lint the Debian maintainer scripts (sh -n)
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_DIR="$RUNNER_TEMP/gulogulo-control"
          mkdir -p "$CONTROL_DIR"
          dpkg-deb -e "$DEB" "$CONTROL_DIR"
          test -f "$CONTROL_DIR/postinst"
          test -f "$CONTROL_DIR/prerm"
          test -f "$CONTROL_DIR/postrm"
          for script in postinst prerm postrm; do
            sh -n "$CONTROL_DIR/$script"
            echo "$script: syntax OK"
          done

      - name: Dry-run install (dpkg --unpack, no postinst/systemd)
        shell: bash
        run: |
          set -euo pipefail
          # `dpkg --unpack` really extracts this package's payload to
          # /opt/gulogulo using dpkg itself (not just `dpkg -c` listing) -
          # this is the strongest install proof this container can safely
          # give, since it stops short of `--configure`, which is what
          # would run postinst's `systemctl enable --now gulogulo` against
          # a container with no init system.
          dpkg --unpack "$DEB"
          test -f /opt/gulogulo/dist/server/src/runtime/index.js
          test -f /opt/gulogulo/web/index.html
          test -f /opt/gulogulo/.env.example
          dpkg-query -W -f='${Status}\n' gulogulo | grep -qE 'install ok unpacked'

          # Removing an unpacked-but-never-configured package exercises
          # prerm's/postrm's "nothing to do" branches for real (no systemd
          # unit and no .env exist yet, since postinst never ran) - a
          # genuine, safe smoke test of both scripts' guard clauses.
          dpkg --purge gulogulo
          test ! -d /opt/gulogulo

      - name: Upload the .deb package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gulogulo-plesk-package
          path: |
            packaging/dist/gulogulo_*_all.deb
            packaging/dist/gulogulo_*_all.deb.sha256
          if-no-files-found: error
