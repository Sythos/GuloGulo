name: Commit tests

on:
  push:
  workflow_dispatch:
    inputs:
      architecture_mode:
        description: Run the fast amd64 gate or the final arm64-only gate
        type: choice
        required: false
        default: amd64
        options:
          - amd64
          - multiarch

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: commit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      context: commit
      architecture_mode: ${{ inputs.architecture_mode || 'amd64' }}
