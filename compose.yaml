name: gulogulo

# The unprofiled gulogulo service is the local profile's default runtime. It
# stays unprofiled so the M0 smoke script and the ordinary `docker compose up`
# contract remain backwards compatible. The explicit local, test, and fixture
# profiles below add disposable checks without changing that default.
x-gulogulo-service: &gulogulo-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: &gulogulo-environment
    HOST: ${HOST:-0.0.0.0}
    PORT: ${PORT:-8080}
    APP_ENV: ${APP_ENV:-development}
    GULOGULO_HOST: ${GULOGULO_HOST:-0.0.0.0}
    GULOGULO_PORT: ${GULOGULO_PORT:-8080}
    GULOGULO_ENV: ${GULOGULO_ENV:-development}
    GULOGULO_VERSION: ${GULOGULO_VERSION:-0.0.0}
    GULOGULO_BUILD_DIGEST: ${GULOGULO_BUILD_DIGEST:-development}
    GULOGULO_PATCH_MODE: ${GULOGULO_PATCH_MODE:-build_and_operator}
    GULOGULO_PATCH_STATUS_FILE: ${GULOGULO_PATCH_STATUS_FILE:-/var/lib/gulogulo/patch/status.json}
    GULOGULO_SERVICE_NAME: ${GULOGULO_SERVICE_NAME:-gulogulo-runtime}
    GULOGULO_SHUTDOWN_TIMEOUT_MS: ${GULOGULO_SHUTDOWN_TIMEOUT_MS:-10000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    GULOGULO_FIXTURE_MODE: ${GULOGULO_FIXTURE_MODE:-false}
    GULOGULO_FIXTURE_MANIFEST: ${GULOGULO_FIXTURE_MANIFEST:-/app/test/fixtures/manifest.json}
    LDAP_ENABLED: ${LDAP_ENABLED:-false}
    LDAP_URL: ${LDAP_URL:-ldaps://127.0.0.1:636}
    LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
    LDAP_BIND_DN: ${LDAP_BIND_DN:-}
    LDAP_BIND_SECRET_REF: ${LDAP_BIND_SECRET_REF:-}
    LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-3000}
    POSTGRES_ENABLED: ${POSTGRES_ENABLED:-false}
    POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-gulogulo}
    POSTGRES_USER: ${POSTGRES_USER:-gulogulo}
    POSTGRES_PASSWORD_SECRET_REF: ${POSTGRES_PASSWORD_SECRET_REF:-}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-verify-full}
    POSTGRES_CONNECT_TIMEOUT_MS: ${POSTGRES_CONNECT_TIMEOUT_MS:-3000}
  volumes:
    - runtime-state:/var/lib/gulogulo
    - mail-data:/var/lib/gulogulo/mail
    - dav-data:/var/lib/gulogulo/dav
    - backup-data:/var/lib/gulogulo/backups
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: "no"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

services:
  gulogulo:
    <<: *gulogulo-service
    ports:
      - "127.0.0.1:${GULOGULO_HTTP_PORT:-8080}:8080"

  # The local profile is an opt-in, disposable test runner. The unprofiled
  # service above remains the local runtime and is intentionally not duplicated
  # here, avoiding a second port binding during the default smoke path.
  gulogulo-local-check:
    <<: *gulogulo-service
    profiles: ["local"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    volumes: []
    healthcheck:
      disable: true

  # This profile executes the repository's package test contract in the same
  # image and with no external dependency credentials.
  gulogulo-test:
    <<: *gulogulo-service
    profiles: ["test"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    volumes: []
    healthcheck:
      disable: true

  # The fixture profile validates the committed, non-secret fixture manifest
  # inside the same image. The PowerShell harness runs this one-shot service
  # before probing the default runtime.
  gulogulo-fixture:
    <<: *gulogulo-service
    profiles: ["fixture"]
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import fs from 'node:fs';
        const path = process.env.GULOGULO_FIXTURE_MANIFEST || '/app/test/fixtures/manifest.json';
        const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
        if (manifest.schemaVersion !== 1 || manifest.deterministic !== true) process.exit(1);
        if (!manifest.tenantFixture || !manifest.failureFixture) process.exit(1);
        process.stdout.write('fixture-manifest-ok\n');
    environment:
      <<: *gulogulo-environment
      APP_ENV: fixture
      GULOGULO_ENV: fixture
      GULOGULO_FIXTURE_MODE: "true"
    volumes: []
    healthcheck:
      disable: true

volumes:
  runtime-state:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-runtime-state
  mail-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-mail-data
  dav-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-dav-data
  backup-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-backup-data
