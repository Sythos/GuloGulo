name: gulogulo

# The unprofiled gulogulo service is the local profile's default runtime. It
# stays unprofiled so the M0 smoke script and the ordinary `docker compose up`
# contract remain backwards compatible. The explicit local, test, and fixture
# profiles below add disposable checks without changing that default.
x-gulogulo-service: &gulogulo-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: &gulogulo-environment
    HOST: ${HOST:-0.0.0.0}
    PORT: ${PORT:-8080}
    APP_ENV: ${APP_ENV:-development}
    GULOGULO_HOST: ${GULOGULO_HOST:-0.0.0.0}
    GULOGULO_PORT: ${GULOGULO_PORT:-8080}
    GULOGULO_ENV: ${GULOGULO_ENV:-development}
    GULOGULO_VERSION: ${GULOGULO_VERSION:-0.0.0}
    GULOGULO_BUILD_DIGEST: ${GULOGULO_BUILD_DIGEST:-development}
    GULOGULO_PATCH_MODE: ${GULOGULO_PATCH_MODE:-build_and_operator}
    GULOGULO_PATCH_STATUS_FILE: ${GULOGULO_PATCH_STATUS_FILE:-/var/lib/gulogulo/patch/status.json}
    GULOGULO_SERVICE_NAME: ${GULOGULO_SERVICE_NAME:-gulogulo-runtime}
    GULOGULO_SHUTDOWN_TIMEOUT_MS: ${GULOGULO_SHUTDOWN_TIMEOUT_MS:-10000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    GULOGULO_FIXTURE_MODE: ${GULOGULO_FIXTURE_MODE:-false}
    GULOGULO_FIXTURE_MANIFEST: ${GULOGULO_FIXTURE_MANIFEST:-/app/test/fixtures/manifest.json}
    GULOGULO_VOLUMES_EXTERNAL: ${GULOGULO_VOLUMES_EXTERNAL:-false}
    LDAP_ENABLED: ${LDAP_ENABLED:-false}
    LDAP_URL: ${LDAP_URL:-ldaps://127.0.0.1:636}
    LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
    LDAP_BIND_DN: ${LDAP_BIND_DN:-}
    LDAP_BIND_SECRET_REF: ${LDAP_BIND_SECRET_REF:-}
    LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-3000}
    LDAP_OPERATION_TIMEOUT_MS: ${LDAP_OPERATION_TIMEOUT_MS:-5000}
    LDAP_POOL_MAX: ${LDAP_POOL_MAX:-4}
    LDAP_RETRY_ATTEMPTS: ${LDAP_RETRY_ATTEMPTS:-2}
    POSTGRES_ENABLED: ${POSTGRES_ENABLED:-false}
    POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-gulogulo}
    POSTGRES_USER: ${POSTGRES_USER:-gulogulo}
    POSTGRES_DSN_SECRET_REF: ${POSTGRES_DSN_SECRET_REF:-}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-verify-full}
    POSTGRES_CONNECT_TIMEOUT_MS: ${POSTGRES_CONNECT_TIMEOUT_MS:-3000}
    POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
    POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-8}
    POSTGRES_RETRY_ATTEMPTS: ${POSTGRES_RETRY_ATTEMPTS:-2}
    GULOGULO_MAIL_IMAP_IDLE: ${GULOGULO_MAIL_IMAP_IDLE:-true}
    GULOGULO_MAIL_POP3S_ENABLED: ${GULOGULO_MAIL_POP3S_ENABLED:-false}
    GULOGULO_MAIL_CATCH_ALL: ${GULOGULO_MAIL_CATCH_ALL:-false}
    GULOGULO_MAIL_USER_FORWARDING: ${GULOGULO_MAIL_USER_FORWARDING:-false}
    GULOGULO_MAIL_SMTP_INBOUND_PORT: ${GULOGULO_MAIL_SMTP_INBOUND_PORT:-25}
    GULOGULO_MAIL_SMTP_SUBMISSION_PORT: ${GULOGULO_MAIL_SMTP_SUBMISSION_PORT:-587}
    GULOGULO_MAIL_SMTP_IMPLICIT_TLS_PORT: ${GULOGULO_MAIL_SMTP_IMPLICIT_TLS_PORT:-465}
    GULOGULO_MAIL_IMAPS_PORT: ${GULOGULO_MAIL_IMAPS_PORT:-993}
    GULOGULO_MAIL_LMTP_SOCKET: ${GULOGULO_MAIL_LMTP_SOCKET:-/var/run/dovecot/lmtp}
    GULOGULO_MAILBOX_ROOT: ${GULOGULO_MAILBOX_ROOT:-/var/lib/gulogulo/mail}
    GULOGULO_MAIL_RSPAMD_ENABLED: ${GULOGULO_MAIL_RSPAMD_ENABLED:-true}
    GULOGULO_MAIL_CLAMAV_ENABLED: ${GULOGULO_MAIL_CLAMAV_ENABLED:-true}
    GULOGULO_MAIL_SCAN_FAILURE_MODE: ${GULOGULO_MAIL_SCAN_FAILURE_MODE:-fail_closed}
    GULOGULO_MAIL_MAX_MESSAGE_BYTES: ${GULOGULO_MAIL_MAX_MESSAGE_BYTES:-52428800}
    GULOGULO_MAIL_MAX_RECIPIENTS: ${GULOGULO_MAIL_MAX_RECIPIENTS:-100}
    GULOGULO_MAIL_MAX_CONNECTIONS_PER_IP: ${GULOGULO_MAIL_MAX_CONNECTIONS_PER_IP:-20}
    GULOGULO_MAIL_MAX_MESSAGES_PER_USER_PER_MINUTE: ${GULOGULO_MAIL_MAX_MESSAGES_PER_USER_PER_MINUTE:-60}
    GULOGULO_MAIL_QUEUE_MAX_ATTEMPTS: ${GULOGULO_MAIL_QUEUE_MAX_ATTEMPTS:-5}
    GULOGULO_MAIL_QUEUE_RETRY_BASE_MS: ${GULOGULO_MAIL_QUEUE_RETRY_BASE_MS:-60000}
  volumes:
    - runtime-state:/var/lib/gulogulo
    - mail-data:/var/lib/gulogulo/mail
    - dav-data:/var/lib/gulogulo/dav
    - backup-data:/var/lib/gulogulo/backups
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: "no"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

services:
  gulogulo:
    <<: *gulogulo-service
    ports:
      - "127.0.0.1:${GULOGULO_HTTP_PORT:-8080}:8080"

  # The local profile is an opt-in, disposable test runner. The unprofiled
  # service above remains the local runtime and is intentionally not duplicated
  # here, avoiding a second port binding during the default smoke path.
  gulogulo-local-check:
    <<: *gulogulo-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["local"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    # The disposable test runner rebuilds the ignored browser output before
    # executing the package contract. Keep the production service read-only,
    # but allow this short-lived verification container to write its build
    # output inside the image.
    read_only: false
    volumes: []
    healthcheck:
      disable: true

  # This profile executes the repository's package test contract in the same
  # image and with no external dependency credentials.
  gulogulo-test:
    <<: *gulogulo-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    # `npm test` invokes the browser build and therefore needs to regenerate
    # the ignored `web/dist` output. This profile is disposable; the default
    # runtime service above remains read-only.
    read_only: false
    volumes: []
    healthcheck:
      disable: true

  # The fixture profile validates the committed, non-secret fixture manifest
  # inside the same image. The PowerShell harness runs this one-shot service
  # before probing the default runtime.
  gulogulo-fixture:
    <<: *gulogulo-service
    profiles: ["fixture"]
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import fs from 'node:fs';
        const path = process.env.GULOGULO_FIXTURE_MANIFEST || '/app/test/fixtures/manifest.json';
        const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
        if (manifest.schemaVersion !== 1 || manifest.deterministic !== true) process.exit(1);
        if (!manifest.tenantFixture || !manifest.failureFixture) process.exit(1);
        process.stdout.write('fixture-manifest-ok\n');
    environment:
      <<: *gulogulo-environment
      APP_ENV: fixture
      GULOGULO_ENV: fixture
      GULOGULO_FIXTURE_MODE: "true"
    volumes: []
    healthcheck:
      disable: true

  # LP1 is a disposable, private proof topology. It deliberately uses a
  # separate internal network, loopback-only publication, and named volumes
  # that can be switched to externally managed storage by the operator.
  gulogulo-proof:
    <<: *gulogulo-service
    profiles: ["proof"]
    ports:
      - "127.0.0.1:${GULOGULO_PROOF_HTTP_PORT:-18080}:8080"
    environment:
      <<: *gulogulo-environment
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_FIXTURE_MODE: "true"
      GULOGULO_SERVICE_NAME: gulogulo-lp1-proof
    networks:
      proof-runtime:
        aliases:
          - gulogulo-proof
          - gulogulo.test
          - webmail.localhost
          - calendar.localhost
          - contacts.localhost
    volumes:
      - lp1-runtime-state:/var/lib/gulogulo
      - lp1-mail-data:/var/lib/gulogulo/mail
      - lp1-dav-data:/var/lib/gulogulo/dav
      - lp1-backup-data:/var/lib/gulogulo/backups
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  local-ca:
    build:
      context: docker/lp1-network
      dockerfile: Dockerfile
    profiles: ["proof"]
    user: "0:0"
    command: ["/usr/local/sbin/gulogulo-lp1-ca"]
    environment:
      LP1_CA_DIR: /run/gulogulo-ca
    volumes:
      - lp1-ca-data:/run/gulogulo-ca
    networks:
      proof-runtime:
        aliases:
          - local-ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/gulogulo-ca/ca.crt && test -s /run/gulogulo-ca/gulogulo.test.crt && test -s /run/gulogulo-ca/gulogulo.test.key
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  local-dns:
    build:
      context: docker/lp1-network
      dockerfile: Dockerfile
    profiles: ["proof"]
    command: ["/usr/local/sbin/gulogulo-lp1-dns"]
    environment:
      LP1_DNS_PORT: ${LP1_DNS_PORT:-5353}
    networks:
      proof-runtime:
        aliases:
          - local-dns
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - dnsmasq --test --no-resolv --no-hosts --address=/gulogulo.test/127.0.0.1
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  # This is an on-demand client. It is not started by the proof runtime; the
  # LP1 smoke harness runs it twice, before and after an application restart.
  gulogulo-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["proof-check"]
    command: ["node", "scripts/lp1-proof-check.mjs"]
    environment:
      LP1_CA_DIR: /run/gulogulo-ca
      LP1_PROOF_STATE_DIR: /var/lib/gulogulo/lp1
      LP1_DNS_SERVER: local-dns
      LP1_DNS_PORT: ${LP1_DNS_PORT:-5353}
      LP1_APPLICATION_SERVER: gulogulo-proof
      NODE_EXTRA_CA_CERTS: /run/gulogulo-ca/ca.crt
    volumes:
      - lp1-ca-data:/run/gulogulo-ca:ro
      - lp1-proof-state:/var/lib/gulogulo/lp1
    networks:
      - proof-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

volumes:
  runtime-state:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-runtime-state
    external: ${GULOGULO_VOLUMES_EXTERNAL:-false}
  mail-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-mail-data
    external: ${GULOGULO_VOLUMES_EXTERNAL:-false}
  dav-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-dav-data
    external: ${GULOGULO_VOLUMES_EXTERNAL:-false}
  backup-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-backup-data
    external: ${GULOGULO_VOLUMES_EXTERNAL:-false}
  lp1-ca-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-ca-data
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}
  lp1-runtime-state:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-runtime-state
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}
  lp1-mail-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-mail-data
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}
  lp1-dav-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-dav-data
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}
  lp1-backup-data:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-backup-data
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}
  lp1-proof-state:
    name: ${GULOGULO_VOLUME_PREFIX:-gulogulo}-lp1-proof-state
    external: ${GULOGULO_LP1_VOLUMES_EXTERNAL:-false}

networks:
  proof-runtime:
    name: ${GULOGULO_PROOF_NETWORK:-gulogulo-local-proof}
    internal: true
