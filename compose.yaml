name: gulogulo

# The unprofiled gulogulo service is the local profile's default runtime. It
# stays unprofiled so the M0 smoke script and the ordinary `docker compose up`
# contract remain backwards compatible. The explicit local, test, and fixture
# profiles below add disposable checks without changing that default.
x-gulogulo-service: &gulogulo-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: &gulogulo-environment
    HOST: ${HOST:-0.0.0.0}
    PORT: ${PORT:-8080}
    APP_ENV: ${APP_ENV:-development}
    GULOGULO_HOST: ${GULOGULO_HOST:-0.0.0.0}
    GULOGULO_PORT: ${GULOGULO_PORT:-8080}
    GULOGULO_ENV: ${GULOGULO_ENV:-development}
    GULOGULO_VERSION: ${GULOGULO_VERSION:-0.1.4}
    GULOGULO_BUILD_DIGEST: ${GULOGULO_BUILD_DIGEST:-development}
    GULOGULO_PATCH_MODE: ${GULOGULO_PATCH_MODE:-build_and_operator}
    GULOGULO_PATCH_STATUS_FILE: ${GULOGULO_PATCH_STATUS_FILE:-/var/lib/gulogulo/patch/status.json}
    GULOGULO_SERVICE_NAME: ${GULOGULO_SERVICE_NAME:-gulogulo-runtime}
    GULOGULO_SHUTDOWN_TIMEOUT_MS: ${GULOGULO_SHUTDOWN_TIMEOUT_MS:-10000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    GULOGULO_FIXTURE_MODE: ${GULOGULO_FIXTURE_MODE:-false}
    GULOGULO_FIXTURE_MANIFEST: ${GULOGULO_FIXTURE_MANIFEST:-/app/test/fixtures/manifest.json}
    GULOGULO_VOLUMES_EXTERNAL: ${GULOGULO_VOLUMES_EXTERNAL:-false}
    LDAP_ENABLED: ${LDAP_ENABLED:-false}
    LDAP_URL: ${LDAP_URL:-ldaps://127.0.0.1:636}
    LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
    LDAP_BIND_DN: ${LDAP_BIND_DN:-}
    LDAP_BIND_SECRET_REF: ${LDAP_BIND_SECRET_REF:-}
    LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:-3000}
    LDAP_OPERATION_TIMEOUT_MS: ${LDAP_OPERATION_TIMEOUT_MS:-5000}
    LDAP_POOL_MAX: ${LDAP_POOL_MAX:-4}
    LDAP_RETRY_ATTEMPTS: ${LDAP_RETRY_ATTEMPTS:-2}
    POSTGRES_ENABLED: ${POSTGRES_ENABLED:-false}
    POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-gulogulo}
    POSTGRES_USER: ${POSTGRES_USER:-gulogulo}
    POSTGRES_DSN_SECRET_REF: ${POSTGRES_DSN_SECRET_REF:-}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-verify-full}
    POSTGRES_CONNECT_TIMEOUT_MS: ${POSTGRES_CONNECT_TIMEOUT_MS:-3000}
    POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
    POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-8}
    POSTGRES_RETRY_ATTEMPTS: ${POSTGRES_RETRY_ATTEMPTS:-2}
    CONTROL_PANEL_ENABLED: ${CONTROL_PANEL_ENABLED:-false}
    CONTROL_PANEL_PROVIDER: ${CONTROL_PANEL_PROVIDER:-none}
    CONTROL_PANEL_BASE_URL: ${CONTROL_PANEL_BASE_URL:-}
    CONTROL_PANEL_ACCOUNT_REF: ${CONTROL_PANEL_ACCOUNT_REF:-}
    CONTROL_PANEL_CREDENTIAL_SECRET_REF: ${CONTROL_PANEL_CREDENTIAL_SECRET_REF:-}
    CONTROL_PANEL_WEBHOOK_SECRET_REF: ${CONTROL_PANEL_WEBHOOK_SECRET_REF:-}
    CONTROL_PANEL_SYNC_MODE: ${CONTROL_PANEL_SYNC_MODE:-pull}
    GULOGULO_MAIL_IMAP_IDLE: ${GULOGULO_MAIL_IMAP_IDLE:-true}
    GULOGULO_MAIL_POP3S_ENABLED: ${GULOGULO_MAIL_POP3S_ENABLED:-false}
    GULOGULO_MAIL_CATCH_ALL: ${GULOGULO_MAIL_CATCH_ALL:-false}
    GULOGULO_MAIL_USER_FORWARDING: ${GULOGULO_MAIL_USER_FORWARDING:-false}
    GULOGULO_MAIL_SMTP_INBOUND_PORT: ${GULOGULO_MAIL_SMTP_INBOUND_PORT:-25}
    GULOGULO_MAIL_SMTP_SUBMISSION_PORT: ${GULOGULO_MAIL_SMTP_SUBMISSION_PORT:-587}
    GULOGULO_MAIL_SMTP_IMPLICIT_TLS_PORT: ${GULOGULO_MAIL_SMTP_IMPLICIT_TLS_PORT:-465}
    GULOGULO_MAIL_IMAPS_PORT: ${GULOGULO_MAIL_IMAPS_PORT:-993}
    GULOGULO_MAIL_LMTP_SOCKET: ${GULOGULO_MAIL_LMTP_SOCKET:-/var/run/dovecot/lmtp}
    GULOGULO_MAILBOX_ROOT: ${GULOGULO_MAILBOX_ROOT:-/var/lib/gulogulo/mail}
    GULOGULO_MAIL_RSPAMD_ENABLED: ${GULOGULO_MAIL_RSPAMD_ENABLED:-true}
    GULOGULO_MAIL_CLAMAV_ENABLED: ${GULOGULO_MAIL_CLAMAV_ENABLED:-true}
    GULOGULO_MAIL_SCAN_FAILURE_MODE: ${GULOGULO_MAIL_SCAN_FAILURE_MODE:-fail_closed}
    GULOGULO_MAIL_MAX_MESSAGE_BYTES: ${GULOGULO_MAIL_MAX_MESSAGE_BYTES:-52428800}
    GULOGULO_MAIL_MAX_RECIPIENTS: ${GULOGULO_MAIL_MAX_RECIPIENTS:-100}
    GULOGULO_MAIL_MAX_CONNECTIONS_PER_IP: ${GULOGULO_MAIL_MAX_CONNECTIONS_PER_IP:-20}
    GULOGULO_MAIL_MAX_MESSAGES_PER_USER_PER_MINUTE: ${GULOGULO_MAIL_MAX_MESSAGES_PER_USER_PER_MINUTE:-60}
    GULOGULO_MAIL_QUEUE_MAX_ATTEMPTS: ${GULOGULO_MAIL_QUEUE_MAX_ATTEMPTS:-5}
    GULOGULO_MAIL_QUEUE_RETRY_BASE_MS: ${GULOGULO_MAIL_QUEUE_RETRY_BASE_MS:-60000}
  volumes:
    - runtime-state:/var/lib/gulogulo
    - mail-data:/var/lib/gulogulo/mail
    - dav-data:/var/lib/gulogulo/dav
    - backup-data:/var/lib/gulogulo/backups
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: "no"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

services:
  gulogulo:
    <<: *gulogulo-service
    ports:
      - "127.0.0.1:${GULOGULO_HTTP_PORT:-8080}:8080"

  # The local profile is an opt-in, disposable test runner. The unprofiled
  # service above remains the local runtime and is intentionally not duplicated
  # here, avoiding a second port binding during the default smoke path.
  gulogulo-local-check:
    <<: *gulogulo-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["local"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    # The disposable test runner rebuilds the ignored browser output before
    # executing the package contract. Keep the production service read-only,
    # but allow this short-lived verification container to write its build
    # output inside the image.
    read_only: false
    volumes: []
    healthcheck:
      disable: true

  # This profile executes the repository's package test contract in the same
  # image and with no external dependency credentials.
  gulogulo-test:
    <<: *gulogulo-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    command: ["npm", "test"]
    environment:
      <<: *gulogulo-environment
      APP_ENV: test
      GULOGULO_ENV: test
      GULOGULO_FIXTURE_MODE: "true"
    # `npm test` is a disposable repository-contract check, not a production
    # image workload. The runtime Docker context intentionally excludes tests,
    # fixtures, release manifests, Compose helpers, and CI metadata, so this
    # profile mounts those inputs read-only from the checkout. The image keeps
    # its own development dependencies and generated test output; `web/dist`
    # remains writable only inside this short-lived container.
    read_only: false
    volumes:
      - ./src:/app/src:ro
      - ./web/src:/app/web/src:ro
      - ./web/test:/app/web/test:ro
      - ./scripts:/app/scripts:ro
      - ./release:/app/release:ro
      - ./test:/app/test:ro
      - ./docker:/app/docker:ro
      - ./config:/app/config:ro
      - ./compose.yaml:/app/compose.yaml:ro
      - ./.env.example:/app/.env.example:ro
      - ./tsconfig.lp4.json:/app/tsconfig.lp4.json:ro
      - ./tsconfig.lp5.json:/app/tsconfig.lp5.json:ro
      - ./tsconfig.lp6.json:/app/tsconfig.lp6.json:ro
      - ./tsconfig.lp7.json:/app/tsconfig.lp7.json:ro
      - ./tsconfig.lp8.json:/app/tsconfig.lp8.json:ro
      - ./tsconfig.lp9.json:/app/tsconfig.lp9.json:ro
      - ./.github/workflows/container-release.yml:/app/.github/workflows/container-release.yml:ro
    healthcheck:
      disable: true

  # The fixture profile validates the committed, non-secret fixture manifest
  # inside the production-cleaned image. The runtime Docker context excludes
  # fixtures by policy, so project only this one disposable input directory
  # read-only from the checkout. The PowerShell harness runs this one-shot
  # service before probing the default runtime.
  gulogulo-fixture:
    <<: *gulogulo-service
    profiles: ["fixture"]
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import fs from 'node:fs';
        const path = process.env.GULOGULO_FIXTURE_MANIFEST || '/app/test/fixtures/manifest.json';
        const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
        if (manifest.schemaVersion !== 1 || manifest.deterministic !== true) process.exit(1);
        if (!manifest.tenantFixture || !manifest.failureFixture) process.exit(1);
        process.stdout.write('fixture-manifest-ok\n');
    environment:
      <<: *gulogulo-environment
      APP_ENV: fixture
      GULOGULO_ENV: fixture
      GULOGULO_FIXTURE_MODE: "true"
    volumes:
      - ./test/fixtures:/app/test/fixtures:ro
    healthcheck:
      disable: true

  # LP1 is a disposable, private proof topology. It deliberately uses a
  # separate internal network, loopback-only publication, and named volumes
  # that can be switched to externally managed storage by the operator.
  gulogulo-proof:
    <<: *gulogulo-service
    profiles: ["proof"]
    ports:
      - "127.0.0.1:${GULOGULO_PROOF_HTTP_PORT:-18080}:8080"
      - "[::1]:${GULOGULO_PROOF_HTTP_PORT:-18080}:8080"
    environment:
      <<: *gulogulo-environment
      HOST: "${GULOGULO_PROOF_APP_HOST:-::}"
      GULOGULO_HOST: "${GULOGULO_PROOF_APP_HOST:-::}"
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_FIXTURE_MODE: "true"
      GULOGULO_SERVICE_NAME: gulogulo-lp1-proof
    networks:
      proof-runtime:
        aliases:
          - gulogulo-proof
          - gulogulo.test
          - webmail.localhost
          - calendar.localhost
          - contacts.localhost
    volumes:
      - lp1-runtime-state:/var/lib/gulogulo
      - lp1-mail-data:/var/lib/gulogulo/mail
      - lp1-dav-data:/var/lib/gulogulo/dav
      - lp1-backup-data:/var/lib/gulogulo/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://[::1]:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  local-ca:
    build:
      context: docker/lp1-network
      dockerfile: Dockerfile
    profiles: ["proof"]
    user: "0:10001"
    command: ["/usr/local/sbin/gulogulo-lp1-ca"]
    environment:
      LP1_CA_DIR: /run/gulogulo-ca
    volumes:
      - lp1-ca-data:/run/gulogulo-ca
    networks:
      proof-runtime:
        aliases:
          - local-ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/gulogulo-ca/ca.crt && test -s /run/gulogulo-ca/gulogulo.test.crt && test -s /run/gulogulo-ca/gulogulo.test.key
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  local-dns:
    build:
      context: docker/lp1-network
      dockerfile: Dockerfile
    profiles: ["proof"]
    command: ["/usr/local/sbin/gulogulo-lp1-dns"]
    environment:
      LP1_DNS_PORT: ${LP1_DNS_PORT:-5353}
    networks:
      proof-runtime:
        aliases:
          - local-dns
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - dnsmasq --test --no-resolv --no-hosts --address=/gulogulo.test/127.0.0.1
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  # This is an on-demand client. It is not started by the proof runtime; the
  # LP1 smoke harness runs it twice, before and after an application restart.
  gulogulo-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["proof-check"]
    command: ["node", "scripts/lp1-proof-check.mjs"]
    environment:
      LP1_CA_DIR: /run/gulogulo-ca
      LP1_PROOF_STATE_DIR: /var/lib/gulogulo/lp1
      LP1_DNS_SERVER: local-dns
      LP1_DNS_PORT: ${LP1_DNS_PORT:-5353}
      LP1_APPLICATION_SERVER: gulogulo-proof
      NODE_EXTRA_CA_CERTS: /run/gulogulo-ca/ca.crt
    volumes:
      - lp1-ca-data:/run/gulogulo-ca:ro
      - lp1-proof-state:/var/lib/gulogulo/lp1
      # LP1 proof helpers are checkout-owned test inputs, not runtime image
      # contents. Mount them read-only for this disposable checker only.
      - ./scripts:/app/scripts:ro
    networks:
      - proof-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP1
      com.sythos.gulogulo.proof: local
      com.sythos.gulogulo.network-policy: offline_runtime

  # LP2 is a disposable, synthetic dependency topology. LDAP and PostgreSQL
  # are intentionally not exposed through host ports; the proof client reaches
  # them only over the internal dual-stack network below.
  lp2-ca:
    build:
      context: docker/lp2-tls
      dockerfile: Dockerfile
    profiles: ["lp2"]
    command: ["/usr/local/sbin/gulogulo-lp2-tls"]
    environment:
      LP2_TLS_DIR: /run/gulogulo-lp2-tls
    volumes:
      - lp2-tls-data:/run/gulogulo-lp2-tls
    networks:
      - lp2-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/gulogulo-lp2-tls/ca.crt && test -s /run/gulogulo-lp2-tls/lp2-ldap.crt && test -s /run/gulogulo-lp2-tls/lp2-postgres.crt
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP2
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies

  lp2-ldap:
    build:
      context: docker/lp2-ldap
      dockerfile: Dockerfile
    profiles: ["lp2"]
    environment:
      LP2_TLS_DIR: /run/gulogulo-lp2-tls
      LP2_LDAP_ROOT_DN: ${LP2_LDAP_ROOT_DN:-cn=admin,dc=gulogulo,dc=test}
      LP2_LDAP_ROOT_PASSWORD: ${LP2_LDAP_ROOT_PASSWORD:-lp2-synthetic-root}
      LP2_LDAP_BASE_DN: ${LP2_LDAP_BASE_DN:-dc=gulogulo,dc=test}
      LP2_LDAP_USER_BASE_DN: ${LP2_LDAP_USER_BASE_DN:-ou=users,dc=gulogulo,dc=test}
    volumes:
      - lp2-tls-data:/run/gulogulo-lp2-tls:ro
      - lp2-ldap-data:/var/lib/ldap
    networks:
      lp2-runtime:
        aliases:
          - lp2-ldap
          - ldap.gulogulo.test
    expose:
      - "636"
    depends_on:
      lp2-ca:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP2
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.tls: ldaps

  lp2-postgres:
    build:
      context: docker/lp2-postgres
      dockerfile: Dockerfile
    profiles: ["lp2"]
    environment:
      LP2_TLS_DIR: /run/gulogulo-lp2-tls
      PGDATA: /var/lib/postgresql/lp2-data
      POSTGRES_DB: ${LP2_POSTGRES_DB:-gulogulo}
      POSTGRES_USER: ${LP2_POSTGRES_USER:-gulogulo}
      POSTGRES_PASSWORD: ${LP2_POSTGRES_PASSWORD:-lp2-synthetic-postgres}
    volumes:
      - lp2-tls-data:/run/gulogulo-lp2-tls:ro
      - lp2-postgres-data:/var/lib/postgresql/lp2-data
    networks:
      lp2-runtime:
        aliases:
          - lp2-postgres
          - postgres.gulogulo.test
    expose:
      - "5432"
    depends_on:
      lp2-ca:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP2
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.tls: postgres-verify-full

  gulogulo-lp2-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["lp2-check"]
    command: ["node", "scripts/lp2-proof-smoke.mjs"]
    environment:
      LP2_TLS_DIR: /run/gulogulo-lp2-tls
      LP2_LDAP_URL: ldaps://lp2-ldap:636
      LP2_LDAP_ROOT_DN: ${LP2_LDAP_ROOT_DN:-cn=admin,dc=gulogulo,dc=test}
      LP2_LDAP_ROOT_PASSWORD: ${LP2_LDAP_ROOT_PASSWORD:-lp2-synthetic-root}
      LP2_LDAP_USER_BASE_DN: ${LP2_LDAP_USER_BASE_DN:-ou=users,dc=gulogulo,dc=test}
      LP2_POSTGRES_HOST: lp2-postgres
      LP2_POSTGRES_PORT: 5432
      LP2_POSTGRES_DB: ${LP2_POSTGRES_DB:-gulogulo}
      LP2_POSTGRES_USER: ${LP2_POSTGRES_USER:-gulogulo}
      LP2_POSTGRES_PASSWORD: ${LP2_POSTGRES_PASSWORD:-lp2-synthetic-postgres}
    volumes:
      - lp2-tls-data:/run/gulogulo-lp2-tls:ro
      - lp2-proof-state:/var/lib/gulogulo/lp2:rw
      # The LP2 checker is a disposable checkout-driven proof client. Keep its
      # helper outside the runtime image and expose it read-only at execution.
      - ./scripts:/app/scripts:ro
    networks:
      - lp2-runtime
    depends_on:
      lp2-ldap:
        condition: service_healthy
      lp2-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP2
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies

  # LP3 is a disposable internal mail topology. It provides real Ubuntu
  # Postfix/Dovecot package services plus deterministic Rspamd and ClamAV
  # protocol stubs. No LP3 service publishes a host port or has Internet
  # runtime egress; the proof client is enabled separately with lp3-check.
  lp3-tls:
    build:
      context: docker/lp3-tls
      dockerfile: Dockerfile
    profiles: ["lp3"]
    command: ["/usr/local/sbin/gulogulo-lp3-tls"]
    environment:
      LP3_TLS_DIR: /run/gulogulo-lp3-tls
    volumes:
      - lp3-tls-data:/run/gulogulo-lp3-tls
    networks:
      lp3-runtime:
        aliases:
          - lp3-tls
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/gulogulo-lp3-tls/ca.crt && test -s /run/gulogulo-lp3-tls/lp3-postfix.crt && test -s /run/gulogulo-lp3-tls/lp3-postfix.key && test -s /run/gulogulo-lp3-tls/lp3-dovecot.crt && test -s /run/gulogulo-lp3-tls/lp3-dovecot.key
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.tls: disposable_internal_ca
      com.sythos.gulogulo.mail-role: tls

  lp3-dovecot:
    build:
      context: docker/lp3-dovecot
      dockerfile: Dockerfile
    profiles: ["lp3"]
    environment:
      LP3_TLS_DIR: /run/gulogulo-lp3-tls
    volumes:
      - lp3-tls-data:/run/gulogulo-lp3-tls:ro
      - lp3-mail-data:/var/mail/vhosts
      - lp3-dovecot-state:/var/lib/dovecot
    networks:
      lp3-runtime:
        aliases:
          - lp3-dovecot
          - imap.gulogulo.test
          - lmtp.gulogulo.test
          - sieve.gulogulo.test
    expose:
      - "24"
      - "143"
      - "4190"
      - "993"
    depends_on:
      lp3-tls:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=32m
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: imap,imap_idle,lmtp,sieve
      com.sythos.gulogulo.mail-role: mailbox

  lp3-postfix:
    build:
      context: docker/lp3-postfix
      dockerfile: Dockerfile
    profiles: ["lp3"]
    environment:
      LP3_TLS_DIR: /run/gulogulo-lp3-tls
    volumes:
      - lp3-tls-data:/run/gulogulo-lp3-tls:ro
      - lp3-postfix-spool:/var/spool/postfix
      - lp3-postfix-state:/var/lib/postfix
      - lp3-queue-data:/var/lib/gulogulo/queue
    networks:
      lp3-runtime:
        aliases:
          - lp3-postfix
          - smtp.gulogulo.test
          - submission.gulogulo.test
    expose:
      - "25"
      - "587"
    depends_on:
      lp3-tls:
        condition: service_healthy
      lp3-dovecot:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: local_synthetic
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: smtp,inbound,submission,lmtp
      com.sythos.gulogulo.mail-role: smtp

  lp3-rspamd:
    build:
      context: docker/lp3-rspamd
      dockerfile: Dockerfile
    profiles: ["lp3"]
    environment:
      GULOGULO_SCANNER_SIGNATURE_ROOT: /var/lib/gulogulo/scanner-signatures
      GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS: ${GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS:-604800}
    networks:
      lp3-runtime:
        aliases:
          - lp3-rspamd
          - rspamd.gulogulo.test
    expose:
      - "11333"
    volumes:
      - lp3-rspamd-data:/var/lib/rspamd
      - lp3-scanner-signatures:/var/lib/gulogulo/scanner-signatures:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: protocol_stub
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.production-interoperability: "false"
      com.sythos.gulogulo.protocol: rspamd-http-checkv2
      com.sythos.gulogulo.mail-role: scanner

  lp3-clamav:
    build:
      context: docker/lp3-clamav
      dockerfile: Dockerfile
    profiles: ["lp3"]
    environment:
      GULOGULO_SCANNER_SIGNATURE_ROOT: /var/lib/gulogulo/scanner-signatures
      GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS: ${GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS:-604800}
    networks:
      lp3-runtime:
        aliases:
          - lp3-clamav
          - clamav.gulogulo.test
    expose:
      - "3310"
    volumes:
      - lp3-clamav-data:/var/lib/clamav
      - lp3-scanner-signatures:/var/lib/gulogulo/scanner-signatures:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: protocol_stub
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.production-interoperability: "false"
      com.sythos.gulogulo.protocol: clamd-instream
      com.sythos.gulogulo.mail-role: scanner

  gulogulo-lp3-proof-check:
    build:
      context: docker/lp3-proof
      dockerfile: Dockerfile
    profiles: ["lp3-check"]
    command: ["/usr/bin/python3", "/usr/local/bin/gulogulo-lp3-proof"]
    environment:
      GULOGULO_SCANNER_SIGNATURE_ROOT: /var/lib/gulogulo/scanner-signatures
      GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS: ${GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS:-604800}
    volumes:
      - lp3-scanner-signatures:/var/lib/gulogulo/scanner-signatures:ro
    networks:
      - lp3-runtime
    depends_on:
      lp3-postfix:
        condition: service_healthy
      lp3-dovecot:
        condition: service_healthy
      lp3-rspamd:
        condition: service_healthy
      lp3-clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: local_synthetic_mail
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: smtp,imap,imap_idle,lmtp,sieve,rspamd,clamav
      com.sythos.gulogulo.mail-role: proof

  # This disposable client runs the compiled TypeScript mail contracts from
  # the application image. It is attached to lp3-runtime in the Compose model
  # because `docker compose run` does not provide a portable --network option
  # across the Compose versions supported by the project.
  gulogulo-lp3-proof-node:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["lp3-check"]
    command: ["node", "scripts/lp3-proof-smoke.mjs"]
    environment:
      GULOGULO_SCANNER_SIGNATURE_ROOT: /var/lib/gulogulo/scanner-signatures
      GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS: ${GULOGULO_SCANNER_SIGNATURE_MAX_AGE_SECONDS:-604800}
      LP3_TLS_DIR: /run/gulogulo-lp3-tls
    volumes:
      - lp3-scanner-signatures:/var/lib/gulogulo/scanner-signatures:ro
      - lp3-tls-data:/run/gulogulo-lp3-tls:ro
      # The typed LP3 proof helper is checkout-owned and mounted read-only only
      # for this disposable client; it is not part of the release image.
      - ./scripts:/app/scripts:ro
      # The proof reads only the committed LP3 manifest; keep release evidence
      # outside the image and project it read-only for this disposable client.
      - ./release:/app/release:ro
    networks:
      - lp3-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP3
      com.sythos.gulogulo.proof: local_synthetic_mail_typed
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: smtp,imap,imap_idle,lmtp,sieve,rspamd,clamav
      com.sythos.gulogulo.mail-role: proof

  # LP4 runs the compiled web/API runtime and deterministic DAV contract
  # stores on a private dual-stack network. Login credentials are mandatory
  # runtime inputs generated by the smoke harness; this file contains no
  # credential defaults. The application and proof client publish no ports.
  gulogulo-lp4-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["lp4"]
    command: ["node", "--experimental-strip-types", "scripts/lp4-web-runtime.ts"]
    environment:
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_FIXTURE_MODE: "true"
      GULOGULO_SERVICE_NAME: gulogulo-lp4-web
      HOST: "::"
      PORT: "8080"
      LP4_LOGIN_EMAIL: ${LP4_LOGIN_EMAIL}
      LP4_LOGIN_PASSWORD: ${LP4_LOGIN_PASSWORD}
      LP4_TENANT_ID: ${LP4_TENANT_ID:-acme}
      LP4_TENANT_DOMAIN: ${LP4_TENANT_DOMAIN:-example.test}
      LP4_USER_ID: ${LP4_USER_ID:-alice}
      LP4_DAV_STATE_DIR: /var/lib/gulogulo/dav
    volumes:
      # LP4 proof code is a checkout-owned disposable client, not runtime
      # image content. Mount it read-only for the isolated proof only.
      - ./scripts:/app/scripts:ro
      - lp4-runtime-state:/var/lib/gulogulo/runtime
      - lp4-dav-data:/var/lib/gulogulo/dav
    networks:
      lp4-runtime:
        aliases:
          - gulogulo-lp4-web
          - webmail.example.test
          - calendar.example.test
          - contacts.example.test
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://[::1]:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 30
    labels:
      com.sythos.gulogulo.milestone: LP4
      com.sythos.gulogulo.proof: local_synthetic_web_dav
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: http,session,caldav,carddav,discovery
      com.sythos.gulogulo.content-access: tenant_user_only

  gulogulo-lp4-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["lp4-check"]
    command: ["node", "--experimental-strip-types", "scripts/lp4-proof-check.ts"]
    environment:
      LP4_BASE_URL: http://gulogulo-lp4-web:8080
      LP4_LOGIN_EMAIL: ${LP4_LOGIN_EMAIL}
      LP4_LOGIN_PASSWORD: ${LP4_LOGIN_PASSWORD}
      LP4_TENANT_ID: ${LP4_TENANT_ID:-acme}
      LP4_USER_ID: ${LP4_USER_ID:-alice}
    networks:
      - lp4-runtime
    depends_on:
      gulogulo-lp4-web:
        condition: service_healthy
    volumes:
      # LP4 proof code is checkout-owned and mounted read-only only for this
      # disposable checker; it is not retained in the runtime image.
      - ./scripts:/app/scripts:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP4
      com.sythos.gulogulo.proof: local_synthetic_web_dav_client
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: http,session,caldav,carddav,discovery

  # LP5 is the bounded local operations proof. It reuses the deterministic
  # LP4 runtime fixture and adds a disposable, isolated maintenance helper.
  gulogulo-lp5-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["lp5"]
    command: ["node", "--experimental-strip-types", "scripts/lp4-web-runtime.ts"]
    environment:
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_SERVICE_NAME: gulogulo-lp5-web
      HOST: "::"
      PORT: "8080"
      LP4_LOGIN_EMAIL: ${LP5_LOGIN_EMAIL}
      LP4_LOGIN_PASSWORD: ${LP5_LOGIN_PASSWORD}
      LP4_TENANT_ID: ${LP5_TENANT_ID:-acme}
      LP4_TENANT_DOMAIN: ${LP5_TENANT_DOMAIN:-example.test}
      LP4_USER_ID: ${LP5_USER_ID:-alice}
      LP4_DAV_STATE_DIR: /var/lib/gulogulo/dav
      GULOGULO_PATCH_STATUS_FILE: /var/lib/gulogulo/patch/status.json
    volumes:
      - lp5-runtime-state:/var/lib/gulogulo/runtime
      - lp5-dav-data:/var/lib/gulogulo/dav
      - lp5-patch-state:/var/lib/gulogulo/patch:ro
      # LP5 reuses the disposable LP4 runtime helper from the checkout.
      - ./scripts:/app/scripts:ro
    networks:
      lp5-runtime:
        aliases:
          - gulogulo-lp5-web
          - webmail.lp5.gulogulo.test
          - calendar.lp5.gulogulo.test
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://[::1]:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 30
    labels:
      com.sythos.gulogulo.milestone: LP5
      com.sythos.gulogulo.proof: local_synthetic_operations_capacity
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: http,session,metrics,patch_status
      com.sythos.gulogulo.content-access: tenant_user_only

  gulogulo-lp5-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["lp5-check"]
    command: ["node", "--experimental-strip-types", "scripts/lp5-proof-check.ts"]
    environment:
      LP5_BASE_URL: http://gulogulo-lp5-web:8080
      LP5_LOGIN_EMAIL: ${LP5_LOGIN_EMAIL}
      LP5_LOGIN_PASSWORD: ${LP5_LOGIN_PASSWORD}
      LP5_TENANT_ID: ${LP5_TENANT_ID:-acme}
      LP5_TENANT_DOMAIN: ${LP5_TENANT_DOMAIN:-example.test}
      LP5_USER_ID: ${LP5_USER_ID:-alice}
      LP5_STARTUP_MS: ${LP5_STARTUP_MS:-0}
      LP5_READINESS_MS: ${LP5_READINESS_MS:-0}
      LP5_MEMORY_MIB: ${LP5_MEMORY_MIB:-0}
      LP5_CPU_MILLIS: ${LP5_CPU_MILLIS:-0}
      LP5_PIDS: ${LP5_PIDS:-0}
    networks:
      - lp5-runtime
    depends_on:
      gulogulo-lp5-web:
        condition: service_healthy
    volumes:
      # LP5 proof code is checkout-owned and mounted read-only only for this
      # disposable checker; it is not retained in the runtime image.
      - ./scripts:/app/scripts:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP5
      com.sythos.gulogulo.proof: local_synthetic_operations_capacity_client
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: http,session,metrics,patch_status

  # The maintenance helper is the only LP5 writer of patch-state. The
  # application mounts this volume read-only and cannot invoke APT.
  gulogulo-lp5-maintenance:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["lp5-check"]
    command: ["/usr/local/sbin/gulogulo-container-patch", "status"]
    user: "0:0"
    volumes:
      # LP5 proof code remains outside the runtime image and is read-only.
      - ./scripts:/app/scripts:ro
      - lp5-patch-state:/var/lib/gulogulo/patch
    networks:
      - lp5-runtime
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP5
      com.sythos.gulogulo.proof: disposable_patch_status
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.protocols: patch_status_only

  # LP6 is an offline, synthetic backup/restore/retention rehearsal. The
  # source data volume is intentionally absent from the isolated restore
  # service; restore can consume only a read-only backup volume.
  gulogulo-lp6-source-fixture:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP6_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp6-check"]
    command: ["node", "--experimental-strip-types", "scripts/lp6-source-fixture.ts"]
    # Named Docker volumes are initially root-owned. These disposable local
    # writers need no capabilities and have no host or socket access.
    user: "0:0"
    environment:
      LP6_SOURCE_DIR: /var/lib/gulogulo/lp6-source
    volumes:
      - lp6-source-data:/var/lib/gulogulo/lp6-source
      - ./scripts:/app/scripts:ro
    networks:
      - lp6-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP6
      com.sythos.gulogulo.proof: local_synthetic_backup_source
      com.sythos.gulogulo.network-policy: offline_dependencies

  gulogulo-lp6-backup:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP6_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp6"]
    command: ["node", "--experimental-strip-types", "scripts/lp6-backup-worker.ts"]
    user: "0:0"
    environment:
      LP6_SOURCE_DIR: /var/lib/gulogulo/lp6-source
      LP6_BACKUP_DIR: /var/lib/gulogulo/lp6-backup
      LP6_TEST_KEY_B64: ${LP6_TEST_KEY_B64}
      LP6_KEY_REFERENCE: ${LP6_KEY_REFERENCE:-kms/local-synthetic/lp6-v1}
    volumes:
      - lp6-source-data:/var/lib/gulogulo/lp6-source:ro
      - lp6-backup-data:/var/lib/gulogulo/lp6-backup
      - ./scripts:/app/scripts:ro
    networks:
      - lp6-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP6
      com.sythos.gulogulo.proof: local_synthetic_encrypted_backup
      com.sythos.gulogulo.network-policy: offline_dependencies

  gulogulo-lp6-restore:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP6_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp6-check"]
    command: ["node", "--experimental-strip-types", "scripts/lp6-restore-worker.ts"]
    user: "0:0"
    environment:
      LP6_BACKUP_DIR: /var/lib/gulogulo/lp6-backup
      LP6_RESTORE_DIR: /var/lib/gulogulo/lp6-restore
      LP6_TEST_KEY_B64: ${LP6_TEST_KEY_B64}
    volumes:
      - lp6-backup-data:/var/lib/gulogulo/lp6-backup:ro
      - lp6-restore-data:/var/lib/gulogulo/lp6-restore
      - ./scripts:/app/scripts:ro
    networks:
      - lp6-runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP6
      com.sythos.gulogulo.proof: local_synthetic_isolated_restore
      com.sythos.gulogulo.network-policy: offline_dependencies

  # LP7 is a bounded replacement rehearsal. Blue and green run the same
  # deterministic runtime against the same durable volumes; the proof runner
  # changes the serving slot by stopping one container and verifies rollback
  # without copying mailbox, queue, DAV, or backup state through the app.
  # There is deliberately no host port or Docker socket in this topology.
  gulogulo-lp7-blue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP7_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp7"]
    command: ["node", "--experimental-strip-types", "scripts/lp4-web-runtime.ts"]
    environment:
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_SERVICE_NAME: gulogulo-lp7-blue
      GULOGULO_VERSION: ${GULOGULO_LP7_BLUE_VERSION:-0.0.0-blue}
      GULOGULO_BUILD_DIGEST: ${GULOGULO_LP7_BLUE_DIGEST:-sha256:lp7-blue}
      HOST: "::"
      PORT: "8080"
      LP4_LOGIN_EMAIL: ${LP7_LOGIN_EMAIL}
      LP4_LOGIN_PASSWORD: ${LP7_LOGIN_PASSWORD}
      LP4_TENANT_ID: ${LP7_TENANT_ID:-acme}
      LP4_TENANT_DOMAIN: ${LP7_TENANT_DOMAIN:-example.test}
      LP4_USER_ID: ${LP7_USER_ID:-alice}
      LP4_DAV_STATE_DIR: /var/lib/gulogulo/dav
    volumes:
      - lp7-runtime-state:/var/lib/gulogulo/runtime
      - lp7-mail-data:/var/lib/gulogulo/mail
      - lp7-dav-data:/var/lib/gulogulo/dav
      - lp7-queue-data:/var/lib/gulogulo/queue
      - lp7-backup-data:/var/lib/gulogulo/backups
      - ./scripts:/app/scripts:ro
    networks:
      lp7-runtime:
        aliases:
          - gulogulo-lp7-blue
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://[::1]:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 30
    labels:
      com.sythos.gulogulo.milestone: LP7
      com.sythos.gulogulo.proof: local_synthetic_replacement_blue
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.upgrade-track: blue
      com.sythos.gulogulo.protocols: http,session,caldav,carddav,queue

  gulogulo-lp7-green:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP7_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp7"]
    command: ["node", "--experimental-strip-types", "scripts/lp4-web-runtime.ts"]
    environment:
      APP_ENV: local-proof
      GULOGULO_ENV: local-proof
      GULOGULO_SERVICE_NAME: gulogulo-lp7-green
      GULOGULO_VERSION: ${GULOGULO_LP7_GREEN_VERSION:-0.0.0-green}
      GULOGULO_BUILD_DIGEST: ${GULOGULO_LP7_GREEN_DIGEST:-sha256:lp7-green}
      HOST: "::"
      PORT: "8080"
      LP4_LOGIN_EMAIL: ${LP7_LOGIN_EMAIL}
      LP4_LOGIN_PASSWORD: ${LP7_LOGIN_PASSWORD}
      LP4_TENANT_ID: ${LP7_TENANT_ID:-acme}
      LP4_TENANT_DOMAIN: ${LP7_TENANT_DOMAIN:-example.test}
      LP4_USER_ID: ${LP7_USER_ID:-alice}
      LP4_DAV_STATE_DIR: /var/lib/gulogulo/dav
    volumes:
      - lp7-runtime-state:/var/lib/gulogulo/runtime
      - lp7-mail-data:/var/lib/gulogulo/mail
      - lp7-dav-data:/var/lib/gulogulo/dav
      - lp7-queue-data:/var/lib/gulogulo/queue
      - lp7-backup-data:/var/lib/gulogulo/backups
      - ./scripts:/app/scripts:ro
    networks:
      lp7-runtime:
        aliases:
          - gulogulo-lp7-green
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256
    init: true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://[::1]:'+(process.env.PORT||8080)+'/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 30
    labels:
      com.sythos.gulogulo.milestone: LP7
      com.sythos.gulogulo.proof: local_synthetic_replacement_green
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.upgrade-track: green
      com.sythos.gulogulo.protocols: http,session,caldav,carddav,queue

  gulogulo-lp7-proof-check:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    platform: ${GULOGULO_LP7_COMPOSE_PLATFORM:-linux/amd64}
    profiles: ["lp7-check"]
    command: ["node", "--experimental-strip-types", "scripts/lp7-proof-check.ts"]
    user: "10001:10001"
    environment:
      LP7_BLUE_BASE_URL: http://gulogulo-lp7-blue:8080
      LP7_GREEN_BASE_URL: http://gulogulo-lp7-green:8080
      LP7_BLUE_VERSION: ${GULOGULO_LP7_BLUE_VERSION:-0.0.0-blue}
      LP7_GREEN_VERSION: ${GULOGULO_LP7_GREEN_VERSION:-0.0.0-green}
      LP7_BLUE_DIGEST: ${GULOGULO_LP7_BLUE_DIGEST:-sha256:lp7-blue}
      LP7_GREEN_DIGEST: ${GULOGULO_LP7_GREEN_DIGEST:-sha256:lp7-green}
      LP7_LOGIN_EMAIL: ${LP7_LOGIN_EMAIL}
      LP7_LOGIN_PASSWORD: ${LP7_LOGIN_PASSWORD}
      LP7_TENANT_ID: ${LP7_TENANT_ID:-acme}
      LP7_USER_ID: ${LP7_USER_ID:-alice}
      LP7_DAV_STATE_DIR: /var/lib/gulogulo/dav
      LP7_PROOF_STATE_DIR: /var/lib/gulogulo/lp7
      LP7_RUNTIME_STATE_DIR: /var/lib/gulogulo/runtime
      LP7_MAIL_STATE_DIR: /var/lib/gulogulo/mail
      LP7_QUEUE_STATE_DIR: /var/lib/gulogulo/queue
      LP7_BACKUP_STATE_DIR: /var/lib/gulogulo/backups
    volumes:
      - lp7-runtime-state:/var/lib/gulogulo/runtime
      - lp7-mail-data:/var/lib/gulogulo/mail
      - lp7-dav-data:/var/lib/gulogulo/dav:ro
      - lp7-queue-data:/var/lib/gulogulo/queue
      - lp7-backup-data:/var/lib/gulogulo/backups
      - lp7-proof-state:/var/lib/gulogulo/lp7
      - ./scripts:/app/scripts:ro
    networks:
      - lp7-runtime
    depends_on:
      gulogulo-lp7-blue:
        condition: service_healthy
      gulogulo-lp7-green:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    init: true
    restart: "no"
    labels:
      com.sythos.gulogulo.milestone: LP7
      com.sythos.gulogulo.proof: local_synthetic_replacement_proof_check
      com.sythos.gulogulo.network-policy: offline_dependencies
      com.sythos.gulogulo.upgrade-track: checker
      com.sythos.gulogulo.protocols: http,session,caldav,carddav,queue,rollback

