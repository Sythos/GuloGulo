site_name: Gulo Gulo
site_description: >-
  Secure, tenant-isolated mail, calendar, and contacts groupware, distributed
  as cPanel, Plesk, and standalone packages built from the same TypeScript
  core.
site_url: https://sythos.github.io/GuloGulo/
site_author: Sythos
repo_url: https://github.com/Sythos/GuloGulo
repo_name: Sythos/GuloGulo
copyright: MIT licensed

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Install and setup: install.md
  - Guide:
      - Overview: guide/index.md
      - Configuration: guide/configuration.md
      - Server TypeScript boundary: guide/server-typescript.md
      - Web foundation: guide/web-foundation.md
      - External identity and PostgreSQL: guide/identity-and-postgres.md
      - Mail core and delivery safety: guide/mail-core.md
      - CalDAV, CardDAV, and discovery: guide/dav-and-discovery.md
      - RBAC, administration, and MFA: guide/rbac-admin-mfa.md
      - Storage and quotas: guide/storage-and-quotas.md
      - Retention, backup, and restore: guide/lifecycle-backup-dr.md
      - Runtime and observability: guide/observability.md
      - Secret store and rotation: guide/secret-store-and-rotation.md
      - Scanner signature volume: guide/scanner-signature-volume.md
      - Abuse controls and production readiness: guide/abuse-deployment.md
      - Optional Plesk and cPanel integration: guide/control-panel-integration.md
      - API and MCP operations: guide/api-and-mcp.md
      - Upgrade and migration operations: guide/upgrade-and-migration.md
      - Release readiness: guide/release-readiness.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon-32.png
  logo: assets/brand-mark.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.share

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - tables
