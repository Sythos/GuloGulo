<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/favicon-192.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/favicon-512.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <main class="page">
    {{ content }}
  </main>
  <footer class="page-footer">
    <p>
      <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
      · {{ site.license }} licensed
      · <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
    </p>
  </footer>
</body>
</html>
